# /etc/nginx/sites-available/buulgyeong 로 복사 후 sites-enabled 에 링크.
# HTTPS는 `sudo certbot --nginx -d buulgyeong.duckdns.org` 가 이 파일에 자동으로 추가해준다.
server {
    listen 80;
    server_name buulgyeong.duckdns.org;

    # 이미지 업로드(스프링 multipart 10MB 제한과 맞춤)
    client_max_body_size 10m;

    # 목탁회 WebSocket - Upgrade 헤더가 없으면 연결이 안 되고, 기본 read timeout(60초)이면
    # 조용한 연결이 끊기므로 넉넉히 늘린다.
    location /ws/ {
        proxy_pass http://127.0.0.1:9797;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:9797;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
