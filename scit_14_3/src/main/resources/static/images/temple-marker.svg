<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- 배경 원 (흰 테두리 있는 동그란 핀 느낌) -->
  <circle cx="20" cy="18" r="17" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <!-- 절 실루엣 (다층 지붕 느낌의 탑) -->
  <g fill="#c0392b">
    <!-- 상단 뾰족 지붕 -->
    <polygon points="20,6 25,13 15,13" />
    <!-- 1층 몸통 -->
    <rect x="17" y="13" width="6" height="4" />
    <!-- 중간 지붕 -->
    <polygon points="20,14 28,20 12,20" />
    <!-- 2층 몸통 -->
    <rect x="15" y="20" width="10" height="4" />
    <!-- 하단 지붕 -->
    <polygon points="20,21 31,28 9,28" />
  </g>
  <!-- 핀 꼬리 (아래로 뾰족하게, 지도 위치 표시용) -->
  <polygon points="20,40 14,29 26,29" fill="#c0392b"/>
</svg>
