<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사찰 예절 가이드</title>
    <!-- TODO: 다른 페이지들처럼 common-includes.html 헤더/네비를 포함할지,
         아니면 EtiquetteSimulation.html처럼 독립 페이지로 둘지 결정 필요.
         지금은 시뮬레이션 페이지와 톤을 맞추기 위해 비워둠. -->
    <link rel="stylesheet" th:href="@{/css/etiquetteGuide.css}">
</head>
<body>

<div id="guide-root">

    <div class="guide-header">
        <div class="kicker">준비하기</div>
        <h1>사찰 예절 가이드</h1>
        <p>처음 사찰에 방문할 때 알아두면 좋은 예절을 상황별로 정리했어요.<br>궁금한 항목을 눌러보세요.</p>
    </div>

    <!-- TODO: 지금은 CATEGORIES가 etiquetteGuide.js 안에 하드코딩되어 있음.
         실제로는 컨트롤러가 BUDDHISM_INFO에서 category='예절가이드' 8개 row를
         조회해서 이 자리에 title/content를 내려줘야 함 — 예:
         th:each="post : ${posts}"로 서버 렌더링하거나,
         모델 데이터를 JS 배열로 그대로 내려서 지금 JS의 parseContent()/
         renderCategory()를 재사용하는 두 가지 방법이 있음. -->
    <div id="category-list"></div>

    <div class="sim-cta">
        <a th:href="@{/etiquette-simulation}">시뮬레이션 하러가기</a>
    </div>

</div>

<script th:src="@{/js/etiquetteGuide.js}"></script>
</body>
</html>
