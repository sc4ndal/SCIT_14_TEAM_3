<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사찰 예절 가이드</title>
    <!-- TODO: 다른 페이지들처럼 common-includes.html 헤더/네비를 포함할지,
         아니면 EtiquetteSimulation.html처럼 독립 페이지로 둘지 결정 필요.
         지금은 시뮬레이션 페이지와 톤을 맞추기 위해 비워둠. -->
    <link rel="stylesheet" th:href="@{/css/buddhism/etiquetteGuide.css}">
    <title>사찰 예절 가이드 | 산문</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/buddhism/buddhism.css}">
</head>
<body>

<div th:replace="~{fragments/common-includes :: commonIncludes}"></div>

<div id="guide-root">

    <div class="guide-header">
        <div class="kicker">준비하기</div>
        <h1>사찰 예절 가이드</h1>
        <p>처음 사찰에 방문할 때 알아두면 좋은 예절을 상황별로 정리했어요.<br>궁금한 항목을 눌러보세요.</p>
    </div>

    <div id="category-list">
        <section class="category-card" th:each="post : ${posts}">
            <h2 th:text="${post.title}"></h2>
            <ul class="item-list" th:text="${post.content}"></ul>
        </section>
    </div>

    <div class="sim-cta">
        <a class="btn-secondary" th:href="@{/}">메인으로 돌아가기</a>
        <a class="btn-primary" th:href="@{/etiquette-simulation}">시뮬레이션 하러가기</a>
    </div>

</div>

<div th:replace="~{fragments/layout :: footer}"></div>

<script th:src="@{/js/buddhism/etiquetteGuide.js}"></script>
</body>
</html>
