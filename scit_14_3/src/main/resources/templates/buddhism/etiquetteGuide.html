<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사찰 예절 가이드</title>
    <!-- TODO: 다른 페이지들처럼 common-includes.html 헤더/네비를 포함할지,
         아니면 EtiquetteSimulation.html처럼 독립 페이지로 둘지 결정 필요.
         지금은 시뮬레이션 페이지와 톤을 맞추기 위해 비워둠. -->
    <link rel="stylesheet" th:href="@{/css/buddhism/etiquetteGuide.css}">
    <title>사찰 예절 가이드 | 산문</title>
    <!-- 알아보기 > 불교 정보 하위 페이지(intro/terms/list)와 같은 동선이라 공통 헤더/푸터를 붙인다.
         독립 화면인 EtiquetteSimulation.html과는 성격이 다름. -->
    <!-- buddhism.css는 서브내비(.subnav)/푸터(.site-footer) 스타일 때문에 같이 부른다.
         본문 스타일은 뒤에 오는 etiquetteGuide.css가 덮어쓴다(로드 순서 유지할 것). -->
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/buddhism/buddhism.css}">
    <link rel="stylesheet" th:href="@{/css/etiquetteGuide.css}">
</head>
<body>

<div th:replace="~{fragments/common-includes :: commonIncludes}"></div>
<div th:replace="~{fragments/layout :: header}"></div>

<div id="guide-root">

    <div class="guide-header">
        <div class="kicker">준비하기</div>
        <h1>사찰 예절 가이드</h1>
        <p>처음 사찰에 방문할 때 알아두면 좋은 예절을 상황별로 정리했어요.<br>궁금한 항목을 눌러보세요.</p>
    </div>

    <p class="guide-empty" th:if="${#lists.isEmpty(categories)}">
        아직 등록된 예절 항목이 없습니다.
    </p>

    <div id="category-list"></div>

    <div class="sim-cta">
        <a th:href="@{/etiquette-simulation}">시뮬레이션 하러가기</a>
    </div>

</div>

<div th:replace="~{fragments/layout :: footer}"></div>

<!-- 서버가 BUDDHISM_INFO(category='예절가이드')에서 읽어온 카드 목록을 그대로 JS로 넘긴다.
     각 항목은 {letter, title, content} 형태이고, content("• 액션 / → 이유" 원문) 파싱은
     etiquetteGuide.js의 parseContent()가 담당한다. -->
<script th:inline="javascript">
    /*<![CDATA[*/
    window.ETIQUETTE_CATEGORIES = /*[[${categories}]]*/ [];
    /*]]>*/
</script>
<script th:src="@{/js/buddhism/etiquetteGuide.js}"></script>
</body>
</html>
