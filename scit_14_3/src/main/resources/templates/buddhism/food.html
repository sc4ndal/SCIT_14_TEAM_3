<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>사찰 음식 | 산문</title>
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<link rel="stylesheet" th:href="@{/css/buddhism/buddhism.css}">
	<link rel="stylesheet" th:href="@{/css/buddhism/food.css}">
</head>
<body>

<div id="auth-info" style="display:none;"
	 sec:authorize="isAuthenticated()"
	 th:attr="data-login-id=${#authentication.principal.username}"></div>

<div th:replace="~{fragments/common-includes :: commonIncludes}"></div>

<main class="food">

	<section class="food-hero">
		<h1 class="food-hero__title">사찰 음식</h1>
		<p class="food-hero__lead">고기와 오신채(마늘·파·부추·달래·양파) 없이도 정갈한 맛을 내는 사찰의 밥상입니다</p>
		<p class="food-hero__more" th:unless="${#lists.isEmpty(foods)}">
			<a th:href="@{/mypage/favorites/foods}" sec:authorize="hasRole('USER')">저장한 사찰음식 모아보기 →</a>
		</p>
		<!-- 관리자 전용 - 음식이 하나도 없을 때도 등록하러 갈 수 있도록 위 문단(th:unless)과 분리 -->
		<p class="food-hero__more" sec:authorize="hasRole('ADMIN')">
			<a th:href="@{/admin/manage(tab='food')}">사찰음식 관리 →</a>
		</p>
	</section>

	<div class="food-divider"></div>

	<p class="food-empty" th:if="${#lists.isEmpty(foods)}">
		아직 등록된 사찰음식이 없습니다.
	</p>

	<div class="food-search" th:unless="${#lists.isEmpty(foods)}">
		<input type="search" id="food-search-input" class="food-search__input"
			   placeholder="음식 이름으로 검색 (예: 두부, 나물, 조림...)" autocomplete="off">
	</div>

	<p class="food-empty" id="food-search-empty" hidden>
		검색 결과가 없습니다.
	</p>

	<div class="food-grid" id="food-grid">
		<article class="food-card" th:each="food : ${foods}" th:attr="data-food-name=${food.foodName()}">

			<img class="food-card__image" th:if="${food.imageUrl() != null}" th:src="${food.imageUrl()}"
				 th:alt="${food.foodName()}">

			<div class="food-card__body">
				<h2 class="food-card__title" th:text="${food.foodName()}">음식명</h2>
				<p class="food-card__desc" th:if="${food.description() != null}" th:text="${food.description()}">소개</p>

				<div class="food-card__recipe" th:if="${food.recipe() != null}">
					<p class="food-card__recipe-title">레시피</p>
					<p class="food-card__recipe-text" th:text="${food.recipe()}">레시피 본문</p>
				</div>

				<!-- footer는 margin-top:auto로 카드 바닥에 항상 고정된다 - 레시피 길이와 무관하게
				     링크/즐겨찾기 버튼 위치가 안 밀리도록 여기 같이 둔다. 링크(왼쪽)는 누구에게나,
				     즐겨찾기(오른쪽)는 일반회원(USER)에게만 보인다. -->
				<div class="food-card__footer">
					<a class="food-card__recipe-link" th:if="${food.recipeUrl() != null}"
					   th:href="${food.recipeUrl()}" target="_blank" rel="noopener noreferrer">
						레시피 참고 링크 →
					</a>
					<button type="button" class="favorite-toggle" sec:authorize="hasRole('USER')"
							th:classappend="${food.favorited()} ? 'is-favorited' : ''"
							th:attr="data-favorite-url=@{'/info/food/' + ${food.recommendationId()} + '/favorite'}, aria-pressed=${food.favorited()}"
							th:data-favorited="${food.favorited()}">
						<span class="favorite-toggle__icon"></span>
						<span class="favorite-toggle__label" th:text="${food.favorited()} ? '즐겨찾기됨' : '즐겨찾기'">즐겨찾기</span>
					</button>
				</div>
			</div>

		</article>
	</div>

	<div id="food-infinite-sentinel" class="food-infinite-sentinel" th:unless="${#lists.isEmpty(foods)}"></div>

	<p class="food-more">
		<a th:href="@{/mypage/favorites/foods}" sec:authorize="hasRole('USER')">저장한 사찰음식 모아보기 →</a>
	</p>

</main>

<div th:replace="~{fragments/layout :: footer}"></div>

<script defer th:src="@{/js/buddhism/favoriteButton.js}"></script>
<script defer th:src="@{/js/buddhism/food.js}"></script>

</body>
</html>
