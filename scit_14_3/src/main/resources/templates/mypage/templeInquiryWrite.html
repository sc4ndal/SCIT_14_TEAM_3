<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="stylesheet" th:href="@{/css/common.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/css/mypage/mypage.css}" type="text/css">
    <title>사찰 문의 작성 · 佛선자</title>
    <link rel="stylesheet" th:href="@{/css/mypage/templeInquiryWrite.css}">
</head>
<body>

<div id="auth-info" style="display:none;"
     sec:authorize="isAuthenticated()"
     th:attr="data-login-id=${#authentication.principal.username}">
</div>

<header>
    <div th:replace="~{fragments/common-includes :: commonIncludes}"></div>
</header>

<main class="mypage-main">
    <div class="mypage-inner">
        <div class="inquiry-hero">
            <h1>사찰에 문의하기</h1>
            <p>예약 취소 기한(24시간 전)이 지났거나 그 외 요청사항이 있으면 사찰에 직접 남겨주세요.<br>사찰이 확인 후 답변드립니다.</p>
        </div>

        <form class="inquiry-card" th:action="@{/mypage/temple-inquiries}" method="post">
            <div class="inquiry-section">
                <p class="reservation-result fail" style="color:var(--destructive);" th:if="${submitError}" th:text="${submitError}"></p>
                <p class="reservation-ref" th:text="'관련 예약번호: #' + ${reservationId}"></p>
                <input type="hidden" name="reservationId" th:value="${reservationId}">
                <h4>제목</h4>
                <input class="inquiry-title-input" type="text" name="title" maxlength="100"
                       placeholder="예: 예약 취소 요청" required>
            </div>
            <div class="inquiry-section">
                <h4>내용</h4>
                <textarea class="inquiry-textarea" name="content"
                          placeholder="취소를 원하시는 이유 등을 자세히 작성해주시면 더 빠르게 처리해드릴 수 있습니다."
                          required></textarea>
            </div>
            <div class="inquiry-actions">
                <button class="inquiry-back-btn" type="button" onclick="location.href='/mypage/myReservations'">취소</button>
                <button class="inquiry-submit-btn" type="submit">문의 등록</button>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
