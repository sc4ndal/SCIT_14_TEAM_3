<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="stylesheet" th:href="@{/css/common.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/css/mypage/mypage.css}" type="text/css">
    <title>문의 작성 · 佛선자</title>
    <link rel="stylesheet" th:href="@{/css/mypage/inquiryWrite.css}">
    <script th:src="@{/js/inquiry/inquiryI18n.js}" defer></script>
</head>
<body>

<div id="auth-info" style="display:none;"
     sec:authorize="isAuthenticated()"
     th:attr="data-login-id=${#authentication.principal.username}">
</div>

<header>
    <div th:replace="~{fragments/common-includes :: commonIncludes}"></div>
</header>

<main class="mypage-main">
    <div class="mypage-inner">
        <div class="inquiry-hero">
            <h1 class="no-translate" data-pi18n="writeTitle">무엇을 도와드릴까요?</h1>
            <p class="no-translate" data-pi18n="writeDesc" data-pi18n-html>닉네임 변경, 불편사항, 개선 제안 등 궁금하신 점을 남겨주시면<br>사이트 관리자가 확인 후 답변드립니다.</p>
        </div>

        <form class="inquiry-card" th:action="@{/mypage/inquiries}" method="post">
            <div class="inquiry-section">
                <h4 class="no-translate" data-pi18n="titleLabel">제목</h4>
                <input class="inquiry-title-input" type="text" name="title" maxlength="100"
                       placeholder="문의 제목을 입력해주세요" data-pi18n-placeholder="writeTitlePh" required>
            </div>
            <div class="inquiry-section">
                <h4 class="no-translate" data-pi18n="contentLabel">내용</h4>
                <textarea class="inquiry-textarea" name="content"
                          placeholder="문의하실 내용을 자세히 작성해주시면 더 정확한 답변을 드릴 수 있습니다."
                          data-pi18n-placeholder="writeContentPh"
                          required></textarea>
            </div>
            <div class="inquiry-actions">
                <button class="inquiry-submit-btn no-translate" data-pi18n="submitInquiryBtn" type="submit">문의 등록</button>
                <button class="inquiry-back-btn no-translate" data-pi18n="cancelBtn" type="button" onclick="location.href='/mypage/inquiries'">취소</button>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
