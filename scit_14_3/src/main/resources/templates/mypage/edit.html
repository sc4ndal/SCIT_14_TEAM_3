<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>회원정보수정 · 사찰 커뮤니티</title>
	<link rel="icon" th:href="@{/favicon.ico}">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/signup.css}">
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<link rel="stylesheet" th:href="@{/css/mypage/edit.css}">
	<script th:src="@{/js/mypage/edit.js}" defer></script>
</head>
<body>

<div class="card">
	<div th:replace="~{fragments/common-includes :: commonIncludes}"></div>

	<div class="header">
		<h1>회원정보수정</h1>
		<p>회원 정보를 확인하고 변경할 수 있습니다</p>
		<p class="mp-login-type">
			<span class="badge"
			      th:classappend="${loginType == 'KAKAO'} ? ' badge--kakao' : ''"
			      th:text="${loginType == 'KAKAO'} ? '카카오 로그인' : '일반 로그인'">일반 로그인</span>
			<span class="mp-loginid" th:text="${user?.loginId}">login_id</span>
		</p>
	</div>

	<!-- ================================================================ -->
	<!-- 1. 기본정보 : 법명 · 연락처 (LOCAL/KAKAO 공통)                      -->
	<!-- ================================================================ -->
	<form class="page-form" id="profileForm" th:action="@{/mypage/edit/profile}" method="post">
		<fieldset>
			<legend>기본정보</legend>

			<p class="form-alert form-alert--ok"  th:if="${msgProfile}" th:text="${msgProfile}"></p>
			<p class="form-alert form-alert--err" th:if="${errProfile}" th:text="${errProfile}"></p>

			<div class="field">
				<label>로그인 아이디</label>
				<input type="text" th:value="${user?.loginId}" readonly disabled>
			</div>

			<div class="field">
				<label>이름 (여권 영문)</label>
				<input type="text" th:value="${user?.name}" readonly disabled>
				<p class="hint">이름 변경은 문의 부탁드립니다.</p>
			</div>

			<div class="field">
				<label for="nickname"><span>법명</span><span class="req">*</span></label>
				<div class="field-inline">
					<input type="text" id="nickname" name="nickname"
					       th:value="${user?.nickname}"
					       th:attr="data-current-nickname=${user?.nickname}"
					       maxlength="30" required autocomplete="off">
					<button type="button" class="btn-check" id="nicknameCheckBtn">중복확인</button>
				</div>
				<span class="check-result" id="nicknameResult"></span>
			</div>

			<div class="field">
				<label for="phone"><span>연락처</span> <span class="optional-note">(선택)</span></label>
				<input type="tel" id="phone" name="phone"
				       th:value="${user?.phone}"
				       maxlength="20" placeholder="010-1234-5678">
			</div>

			<div class="form-actions">
				<button type="submit" class="submit">기본정보 저장</button>
			</div>
		</fieldset>
	</form>

	<!-- ================================================================ -->
	<!-- 2. 이메일 변경 : 인증 메일 발송 방식 (LOCAL/KAKAO 공통)             -->
	<!-- ================================================================ -->
	<form class="page-form" th:action="@{/mypage/edit/email}" method="post">
		<fieldset>
			<legend>이메일 변경</legend>

			<p class="form-alert form-alert--ok"  th:if="${msgEmail}" th:text="${msgEmail}"></p>
			<p class="form-alert form-alert--err" th:if="${errEmail}" th:text="${errEmail}"></p>

			<div class="field">
				<label>현재 이메일</label>
				<input type="text" th:value="${user?.email} ?: '등록된 이메일 없음'" readonly disabled>
			</div>

			<!-- 인증 대기 안내: pendingEmail 플로우가 준비됐을 때만 노출 (현재는 항상 미노출) -->
			<p class="form-alert form-alert--info"
			   th:if="${user?.pendingEmail != null}"
			   th:text="|'${user?.pendingEmail}' 로 인증 메일을 보냈습니다. 메일의 링크를 눌러야 변경이 완료됩니다.|"></p>

			<div class="field">
				<label for="newEmail"><span>새 이메일</span><span class="req">*</span></label>
				<input type="email" id="newEmail" name="newEmail" required
				       autocomplete="email" placeholder="new@example.com">
			</div>

			<!-- LOCAL 회원: 본인 확인용 현재 비밀번호 -->
			<div class="field" th:if="${isLocalMember}">
				<label for="emailCurrentPassword"><span>현재 비밀번호</span><span class="req">*</span></label>
				<input type="password" id="emailCurrentPassword" name="currentPassword"
				       required autocomplete="current-password">
				<p class="hint">본인 확인을 위해 필요합니다.</p>
			</div>

			<!-- 카카오 회원: 재인증 안내 -->
			<p class="hint" th:unless="${isLocalMember}">
				카카오 로그인 계정은 보안을 위해 카카오 재인증 후 변경이 완료됩니다.
			</p>

			<div class="form-actions">
				<button type="submit" class="submit">인증 메일 보내기</button>
			</div>
		</fieldset>
	</form>

	<!-- ================================================================ -->
	<!-- 3. 비밀번호 변경 : LOCAL 회원만 노출                               -->
	<!-- ================================================================ -->
	<form class="page-form" th:if="${isLocalMember}"
	      th:action="@{/mypage/edit/password}" method="post" id="pwForm">
		<fieldset>
			<legend>비밀번호 변경</legend>

			<p class="form-alert form-alert--ok"  th:if="${msgPassword}" th:text="${msgPassword}"></p>
			<p class="form-alert form-alert--err" th:if="${errPassword}" th:text="${errPassword}"></p>

			<div class="field">
				<label for="currentPassword"><span>현재 비밀번호</span><span class="req">*</span></label>
				<input type="password" id="currentPassword" name="currentPassword"
				       required autocomplete="current-password">
			</div>

			<div class="field">
				<label for="newPassword"><span>새 비밀번호</span><span class="req">*</span></label>
				<input type="password" id="newPassword" name="newPassword"
				       required minlength="8" autocomplete="new-password">
				<p class="hint">8자 이상</p>
			</div>

			<div class="field">
				<label for="newPasswordConfirm"><span>새 비밀번호 확인</span><span class="req">*</span></label>
				<input type="password" id="newPasswordConfirm" name="newPasswordConfirm"
				       required minlength="8" autocomplete="new-password">
				<span class="check-result fail" id="pwMismatch" hidden>새 비밀번호가 일치하지 않습니다.</span>
			</div>

			<div class="form-actions">
				<button type="submit" class="submit">비밀번호 변경</button>
			</div>
		</fieldset>
	</form>

	<div class="page-form mp-foot">
		<div class="form-actions">
			<a th:href="@{/mypage}" class="btn-cancel">마이페이지로 돌아가기</a>
		</div>
	</div>

</div>

</body>
</html>
