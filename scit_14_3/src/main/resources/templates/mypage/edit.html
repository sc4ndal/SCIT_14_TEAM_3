<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title th:text="${isTempleAccount} ? '사찰정보수정 · 사찰 커뮤니티' : '회원정보수정 · 사찰 커뮤니티'">회원정보수정 · 사찰 커뮤니티</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/signup.css}">
	<link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>

<div class="card">
	<div th:replace="~{fragments/common-includes :: commonIncludes}"></div>

	<div class="header">
		<h1 th:text="${isTempleAccount} ? '사찰정보수정' : '회원정보수정'">회원정보수정</h1>
	</div>

	<div th:if="${isTempleAccount}">

		<p class="check-result" style="color:#2f6b5e; text-align:center;" th:if="${templeInfoSuccess}">
			사찰 정보가 저장되었습니다.
		</p>

		<!-- 이름/주소/위치/지역/장소유형처럼 잘못 넣으면 문제가 생기는 값은 여기 없음 - 등록 시
		     검증된 뒤로 고정, 변경 필요하면 문의를 통해 관리자에게 요청. 대표이미지/영어지원여부/
		     환불규정/유의사항은 사찰 본인이 제일 잘 아는 값이라 자유롭게 수정 가능. -->
		<form class="page-form" th:action="@{/mypage/temple-info}" method="post" enctype="multipart/form-data">
			<fieldset>
				<legend>사찰 정보</legend>

				<div class="field">
					<label for="imageFile">대표 이미지 <span class="optional-note">(선택)</span></label>
					<input type="file" id="imageFile" name="imageFile" accept="image/*">
					<p class="hint">최대 10MB까지 업로드 가능합니다</p>
					<input type="hidden" name="existingImageUrl" th:value="${formData.imageUrl}">
					<div th:if="${formData.imageUrl != null and !#strings.isEmpty(formData.imageUrl)}" style="margin-top:8px;">
						<img id="imagePreview" alt="" th:src="${formData.imageUrl}"
						     style="display:block;max-width:220px;border-radius:4px;border:1px solid var(--border);">
						<!-- form 태그를 안쪽 form(사찰 정보) 안에 중첩할 수 없어서(HTML상 form 중첩 불가),
						     form="removeImageForm"으로 페이지 아래쪽에 따로 둔 폼과 연결함 -->
						<button type="submit" form="removeImageForm" class="btn-check btn-danger" style="margin-top:6px;">이미지 삭제</button>
					</div>
					<img id="imagePreview" alt="" style="display:none;max-width:220px;margin-top:8px;border-radius:4px;border:1px solid var(--border);"
					     th:if="${formData.imageUrl == null or #strings.isEmpty(formData.imageUrl)}">
				</div>

				<div class="field">
					<label class="terms-checkbox" style="margin-bottom:0;">
						<input type="checkbox" name="supportEnglish" value="true" th:checked="${formData.supportEnglish}">
						<span>영어 안내 지원 가능</span>
					</label>
				</div>

				<div class="field">
					<label for="refundPolicy">환불 규정 <span class="optional-note">(선택)</span></label>
					<textarea id="refundPolicy" name="refundPolicy" rows="4"
					          style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:4px;font-family:inherit;font-size:14px;"
					          th:text="${formData.refundPolicy}"></textarea>
					<p class="hint">프로그램마다 따로 입력하지 않고 여기서 한 번만 등록하면 등록하는 모든 프로그램에 공통 적용됩니다</p>
				</div>

				<div class="field">
					<label for="specialNotice">유의사항 <span class="optional-note">(선택)</span></label>
					<textarea id="specialNotice" name="specialNotice" rows="4"
					          style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:4px;font-family:inherit;font-size:14px;"
					          th:text="${formData.specialNotice}"></textarea>
				</div>
			</fieldset>

			<div class="form-actions">
				<button class="submit" type="submit">저장</button>
			</div>
		</form>

		<form id="removeImageForm" th:action="@{/mypage/temple-info/remove-image}" method="post"
		      onsubmit="return confirm('등록된 이미지를 삭제하시겠습니까?');"></form>

		<p class="check-result" style="color:#2f6b5e; text-align:center;" th:if="${passwordChangeSuccess}">
			비밀번호가 변경되었습니다.
		</p>
		<p class="check-result" id="passwordChangeError" style="color:#b3402f; text-align:center;" th:if="${passwordChangeError}" th:text="${passwordChangeError}">
		</p>
		<p class="check-result" style="color:#c98a2e; text-align:center;" sec:authorize="hasRole('TEMPLE')" th:if="${#authentication.principal.mustChangePassword}">
			관리자가 발급한 임시 비밀번호입니다. 계속 사용하시려면 비밀번호를 변경해주세요.
		</p>

		<form class="page-form" th:action="@{/mypage/temple-password}" method="post">
			<fieldset>
				<legend>비밀번호 변경</legend>

				<div class="field">
					<label for="currentPassword">현재 비밀번호<span class="req">*</span></label>
					<input type="password" id="currentPassword" name="currentPassword" required>
				</div>

				<div class="field">
					<label for="newPassword">새 비밀번호<span class="req">*</span></label>
					<input type="password" id="newPassword" name="newPassword" required>
				</div>

				<div class="field">
					<label for="newPasswordConfirm">새 비밀번호 확인<span class="req">*</span></label>
					<input type="password" id="newPasswordConfirm" required>
					<p class="hint" id="newPasswordMismatch" style="display:none;color:var(--destructive);">비밀번호가 일치하지 않습니다</p>
				</div>
			</fieldset>

			<div class="form-actions">
				<button class="submit" type="submit">변경하기</button>
				<a th:href="@{/}" class="btn-cancel">취소</a>
			</div>
		</form>

	</div>

	<script th:if="${isTempleAccount}">
		// 대표 이미지 로컬 미리보기 (실제 업로드는 폼 제출 시 서버에서 처리)
		const imageFileInput = document.getElementById('imageFile');
		const imagePreview = document.getElementById('imagePreview');
		imageFileInput.addEventListener('change', () => {
			const file = imageFileInput.files[0];
			if (!file) return;
			const reader = new FileReader();
			reader.onload = () => {
				imagePreview.src = reader.result;
				imagePreview.style.display = 'block';
			};
			reader.readAsDataURL(file);
		});

		const currentPasswordInput = document.getElementById('currentPassword');
		const newPasswordInput = document.getElementById('newPassword');
		const newPasswordConfirmInput = document.getElementById('newPasswordConfirm');
		const mismatchHint = document.getElementById('newPasswordMismatch');
		const passwordChangeErrorEl = document.getElementById('passwordChangeError');

		function checkPasswordMatch() {
			const mismatch = newPasswordConfirmInput.value.length > 0 && newPasswordInput.value !== newPasswordConfirmInput.value;
			mismatchHint.style.display = mismatch ? 'block' : 'none';
			return !mismatch;
		}
		newPasswordInput.addEventListener('input', checkPasswordMatch);
		newPasswordConfirmInput.addEventListener('input', checkPasswordMatch);

		// "현재 비밀번호가 일치하지 않습니다" 서버 에러는 다시 입력을 시작하면 바로 치워서 지저분하게 안 남게 함
		if (currentPasswordInput && passwordChangeErrorEl) {
			currentPasswordInput.addEventListener('input', () => {
				passwordChangeErrorEl.style.display = 'none';
			}, { once: true });
		}

		document.querySelector('form[action="/mypage/temple-password"]').addEventListener('submit', (e) => {
			if (!checkPasswordMatch()) {
				e.preventDefault();
			}
		});
	</script>

	<div th:unless="${isTempleAccount}" style="padding:8px 32px 32px; text-align:center; color:var(--ink-soft);">
		<p>회원정보수정 기능은 준비 중입니다.</p>
	</div>

</div>

</body>
</html>
