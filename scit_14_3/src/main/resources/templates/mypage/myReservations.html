<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="stylesheet" th:href="@{/css/common.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/css/mypage/mypage.css}" type="text/css">
    <title>예약목록 · 佛선자</title>
    <link rel="stylesheet" th:href="@{/css/mypage/myReservations.css}">
</head>
<body>

<div id="auth-info" style="display:none;"
     sec:authorize="isAuthenticated()"
     th:attr="data-login-id=${#authentication.principal.username}, data-nickname=${#authentication.principal.nickname}">
</div>

<header>
    <div th:replace="~{fragments/common-includes :: commonIncludes}"></div>
</header>

<main class="mypage-main">
    <div class="mypage-inner">
        <h1 class="page-title">내 예약 목록</h1>

        <!-- ===================== 목록 화면 ===================== -->
        <section id="list-view">
            <h2>예약 내역 (<span id="count-label">0</span>건)</h2>
            <div class="status-filter" id="status-filter">
                <button type="button" data-status="" class="active">전체</button>
                <button type="button" data-status="예약대기">예약대기</button>
                <button type="button" data-status="예약확정">예약확정</button>
                <button type="button" data-status="취소">예약취소</button>
                <button type="button" data-status="이용완료">이용완료</button>
            </div>
            <div id="reservation-list"></div>
        </section>

        <!-- ===================== 상세 화면 ===================== -->
        <section id="detail-view">
            <div class="detail-toolbar">
                <button class="back-btn" id="back-to-list-btn">&larr; 목록으로</button>
                <a class="program-link-btn" id="detail-program-link" href="#">프로그램 정보 보기 →</a>
            </div>

            <div class="detail-card">
                <div class="detail-hero">
                    <span class="status-badge" id="detail-status-badge"></span>
                    <h2 id="detail-title"></h2>
                    <p id="detail-temple-region"></p>
                </div>

                <div class="detail-section">
                    <h4>프로그램 정보</h4>
                    <div class="detail-row"><span>일정</span><span id="detail-duration"></span></div>
                    <div class="detail-row"><span>1인 가격</span><span id="detail-price"></span></div>
                    <div class="detail-row detail-row-wrap"><span>설명</span><span id="detail-description"></span></div>
                </div>

                <div class="detail-section">
                    <h4>내 예약 정보</h4>
                    <div class="detail-row"><span>예약 번호</span><span id="detail-reservation-id"></span></div>
                    <div class="detail-row"><span>신청 일시</span><span id="detail-created-at"></span></div>
                    <div class="detail-row"><span>이용 날짜</span><span id="detail-date-range"></span></div>
                    <div class="detail-row"><span>참가 인원</span><span id="detail-participant-count"></span></div>
                    <div class="detail-row"><span>참가자 정보</span><span id="detail-participants"></span></div>
                    <div class="detail-row"><span>결제 금액</span><span id="detail-amount"></span></div>
                    <div class="detail-row"><span>결제 수단</span><span id="detail-payment-method"></span></div>
                </div>

                <div class="cancel-area">
                    <!-- 이용완료 상태일 때만 노출. 리뷰 미작성이면 "리뷰 작성", 이미 작성했으면
                         "리뷰 수정"/"리뷰 삭제"로 바뀜 (myReservation.js updateReviewButtons 참고) -->
                    <div class="review-btn-row" id="review-btn-row">
                        <a class="review-btn" id="review-btn" href="#">리뷰 작성</a>
                        <button class="review-delete-btn" id="review-delete-btn" type="button">리뷰 삭제</button>
                    </div>
                    <button class="cancel-btn" id="cancel-btn">예약 취소</button>
                    <p class="cancel-note" id="cancel-note"></p>
                    <!-- 체크인 24시간 전 취소 마감이 지나면 위 버튼은 서버가 거부하는데, 그럴 때
                         사찰에 직접 취소를 요청할 수 있는 통로 - reservationId는 showDetail()이 채워줌. -->
                    <a class="temple-inquiry-link" id="temple-inquiry-link" href="#">사찰에 문의하기</a>
                </div>
            </div>
        </section>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/js/mypage/myReservation.js}"></script>
</body>
</html>
