<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>본인 확인 · 사찰 커뮤니티</title>
	<link rel="stylesheet" th:href="@{/css/signup.css}">
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<link rel="icon" th:href="@{/favicon.ico}">
</head>
<body>
<div class="card">
	<div th:replace="~{fragments/common-includes :: commonIncludes}"></div>

	<div class="header">
		<h1><span th:text="${nickname}">닉네임</span>님, 비밀번호를 다시 입력해주세요</h1>
	</div>

	<form class="page-form" th:action="@{/mypage/edit/verify}" method="post">
		<p class="check-result fail" th:if="${verifyError}" th:text="${verifyError}"></p>

		<div class="field">
			<label for="password">비밀번호</label>
			<input type="password" id="password" name="password" autofocus>
		</div>

		<div class="form-actions">
			<button class="submit" type="submit">확인</button>
			<a class="btn-cancel" th:href="@{/mypage}">취소</a>
		</div>
	</form>
</div>
</body>
</html>
