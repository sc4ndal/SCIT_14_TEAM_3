<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>탈퇴 유예기간 · 사찰 커뮤니티</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/signup.css}">
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<link rel="stylesheet" th:href="@{/css/mypage/edit.css}">
	<link rel="icon" th:href="@{/favicon.ico}">
</head>
<body>
<div class="card">
	<div th:replace="~{fragments/common-includes :: commonIncludes}"></div>

	<div class="header">
		<h1>탈퇴 유예기간 중입니다</h1>
		<p>
			<span th:text="${#temporals.format(withdrawalRequestedAt, 'yyyy.MM.dd')}">2026.01.01</span>에 탈퇴를 신청하셨습니다.
			<br><span th:text="${#temporals.format(withdrawalRequestedAt.plusDays(gracePeriodDays), 'yyyy.MM.dd')}">2026.01.31</span>
			이후 계정이 자동으로 확정 처리되며, 그 전까지는 이 화면 외 다른 페이지를 이용할 수 없습니다.
		</p>
	</div>

	<div class="page-form mp-foot">
		<p class="hint" style="text-align:center; margin-bottom:16px;">
			마음이 바뀌셨다면 아래에서 탈퇴를 철회할 수 있습니다.
		</p>
		<div class="form-actions">
			<form th:action="@{/mypage/withdrawal/cancel}" method="post" style="display:contents;">
				<button class="submit" type="submit">탈퇴 철회하기</button>
			</form>
			<form th:action="@{/logout}" method="post" style="display:contents;">
				<button class="btn-cancel" type="submit">로그아웃</button>
			</form>
		</div>
	</div>
</div>
</body>
</html>
