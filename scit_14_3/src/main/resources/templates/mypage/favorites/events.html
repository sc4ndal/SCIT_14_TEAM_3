<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="stylesheet" th:href="@{/css/common.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/css/mypage/mypage.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/css/mypage/favorites.css}" type="text/css">
    <!-- 카드 안쪽 요소(제목/사찰명/소개/날짜/종료뱃지) 스타일은 공개 /events 페이지와 공유 -
         favorites.css가 따로 복제해서 맞추던 걸 없애고 이 파일 자체를 재사용한다. -->
    <link rel="stylesheet" th:href="@{/css/temple/events.css}" type="text/css">
    <title>관심 행사 · 佛선자</title>
</head>

<body>

<div id="auth-info" style="display:none;"
     sec:authorize="isAuthenticated()"
     th:attr="data-login-id=${#authentication.principal.username}"></div>

<header>
    <div th:replace="~{fragments/common-includes :: commonIncludes}"></div>
</header>

<main class="mypage-main">
    <div class="mypage-inner">

        <section class="favorites-hero">
            <h1>관심 행사</h1>
            <p class="favorites-hero__more" th:unless="${#lists.isEmpty(events)}">
                <a th:href="@{/events}">다른 행사 보러가기 →</a>
            </p>
        </section>

        <div class="events-divider"></div>

        <p class="favorites-empty" th:if="${#lists.isEmpty(events)}">
            아직 즐겨찾기한 행사가 없습니다. <a th:href="@{/events}">불교 행사 보러 가기 →</a>
        </p>

        <div class="favorites-search" th:unless="${#lists.isEmpty(events)}">
            <input type="search" id="favorite-events-search-input" class="favorites-search__input"
                   aria-label="검색" placeholder="행사 이름이나 사찰 이름으로 검색 (예: 박람회, 조계사...)" autocomplete="off">
        </div>

        <p class="favorites-search-empty" id="favorite-events-search-empty" hidden>
            검색 결과가 없습니다.
        </p>

        <div class="food-favorite-grid event-favorite-grid" data-favorites-infinite-grid="event-infinite-sentinel"
             data-favorites-search-input="favorite-events-search-input"
             data-favorites-search-empty="favorite-events-search-empty"
             th:unless="${#lists.isEmpty(events)}">
            <article class="food-favorite-card event-favorite-card"
                     th:classappend="${event.past} ? 'event-favorite-card--past' : ''"
                     th:each="event : ${events}" data-remove-on-unfavorite
                     th:attr="data-search-name=${event.title + ' ' + event.templeName}">

                <div class="food-favorite-card__body">
                    <p class="event-card__date" style="margin:0 0 8px;">
                        <span th:text="${#temporals.format(event.startDate, 'yyyy.MM.dd')}">2026.01.01</span>
                        <span th:if="${event.endDate != event.startDate}"
                              th:text="'~ ' + ${#temporals.format(event.endDate, 'yyyy.MM.dd')}">~ 2026.01.07</span>
                        <span class="event-card__past-badge" th:if="${event.past}">종료</span>
                    </p>

                    <h2 class="event-card__title" th:text="${event.title}">행사명</h2>

                    <p class="event-card__temple">
                        <span aria-hidden="true">⌖</span>
                        <span th:text="${event.templeName}">사찰명</span>
                    </p>

                    <p class="event-card__desc" th:if="${event.description != null}"
                       th:text="${event.description}">행사 소개</p>

                    <a class="event-card__link" th:if="${event.linkUrl != null}" th:href="${event.linkUrl}"
                       target="_blank" rel="noopener noreferrer">
                        자세히 보기 →
                    </a>
                </div>

                <div class="event-card__footer">
                    <button type="button" class="favorite-toggle is-favorited"
                            th:attr="data-favorite-url=@{'/events/' + ${event.eventId} + '/favorite'}"
                            data-favorited="true" aria-pressed="true">
                        <span class="favorite-toggle__icon"></span>
                        <span class="favorite-toggle__label">즐겨찾기됨</span>
                    </button>
                </div>

            </article>
        </div>

        <div id="event-infinite-sentinel" class="favorites-infinite-sentinel" th:unless="${#lists.isEmpty(events)}"></div>

        <p class="favorites-more" th:unless="${#lists.isEmpty(events)}">
            <a th:href="@{/events}">다른 행사 보러가기 →</a>
        </p>

    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

<script defer th:src="@{/js/buddhism/favoriteButton.js}"></script>
<script defer th:src="@{/js/mypage/favoritesInfiniteScroll.js}"></script>

</body>
</html>
