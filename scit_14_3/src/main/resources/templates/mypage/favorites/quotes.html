<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="stylesheet" th:href="@{/css/common.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/css/mypage/mypage.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/css/mypage/favorites.css}" type="text/css">
    <title>저장한 불교 한마디 · 佛선자</title>
</head>

<body>

<div id="auth-info" style="display:none;"
     sec:authorize="isAuthenticated()"
     th:attr="data-login-id=${#authentication.principal.username}"></div>

<header>
    <div th:replace="~{fragments/common-includes :: commonIncludes}"></div>
</header>

<main class="mypage-main">
    <div class="mypage-inner">

        <section class="favorites-hero">
            <h1>저장한 불교 한마디</h1>
            <p>마음에 담아둔 한마디를 다시 꺼내 읽어봅니다.</p>
        </section>

        <p class="favorites-empty" th:if="${#lists.isEmpty(quotes)}">
            아직 저장한 한마디가 없습니다. <a th:href="@{/info/quote}">오늘의 한마디 보러가기 →</a>
        </p>

        <div class="quote-favorite-grid" data-favorites-grid="quote-pagination" th:unless="${#lists.isEmpty(quotes)}">
            <article class="quote-favorite-card" th:each="quote : ${quotes}" data-remove-on-unfavorite>

                <div class="quote-favorite-card__text">
                    <p class="quote-favorite-card__content" th:text="${quote.content()}">한마디 내용</p>
                    <p class="quote-favorite-card__source" th:if="${quote.source() != null}"
                       th:text="${quote.source()}">출처</p>
                </div>

                <button type="button" class="favorite-toggle is-favorited"
                        th:attr="data-favorite-url=@{'/info/quote/' + ${quote.quoteId()} + '/favorite'}"
                        data-favorited="true" aria-pressed="true">
                    <span class="favorite-toggle__icon"></span>
                    <span class="favorite-toggle__label">즐겨찾기됨</span>
                </button>

            </article>
        </div>

        <div class="pagination" id="quote-pagination" th:unless="${#lists.isEmpty(quotes)}"></div>

        <p class="favorites-more" th:unless="${#lists.isEmpty(quotes)}">
            <a th:href="@{/info/quote}">다른 한마디 보러가기 →</a>
        </p>

    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

<script defer th:src="@{/js/buddhism/favoriteButton.js}"></script>
<script defer th:src="@{/js/mypage/favoritesPagination.js}"></script>

</body>
</html>
