<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="stylesheet" th:href="@{/css/common.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/css/mypage/mypage.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/css/mypage/favorites.css}" type="text/css">
    <title>관심 사찰음식 · 佛선자</title>
</head>

<body>

<div id="auth-info" style="display:none;"
     sec:authorize="isAuthenticated()"
     th:attr="data-login-id=${#authentication.principal.username}"></div>

<header>
    <div th:replace="~{fragments/common-includes :: commonIncludes}"></div>
</header>

<main class="mypage-main">
    <div class="mypage-inner">

        <section class="favorites-hero">
            <h1>관심 사찰음식</h1>
            <p class="favorites-hero__more" th:unless="${#lists.isEmpty(foods)}">
                <a th:href="@{/info/food}">다른 사찰음식 보러가기 →</a>
            </p>
        </section>

        <div class="favorites-divider"></div>

        <p class="favorites-empty" th:if="${#lists.isEmpty(foods)}">
            아직 저장한 사찰음식이 없습니다. <a th:href="@{/info/food}">사찰 음식 보러가기 →</a>
        </p>

        <div class="favorites-search" th:unless="${#lists.isEmpty(foods)}">
            <input type="search" id="favorite-foods-search-input" class="favorites-search__input"
                   aria-label="검색" placeholder="음식 이름으로 검색 (예: 두부, 나물, 조림...)" autocomplete="off">
        </div>

        <p class="favorites-search-empty" id="favorite-foods-search-empty" hidden>
            검색 결과가 없습니다.
        </p>

        <div class="food-favorite-grid" data-favorites-infinite-grid="food-infinite-sentinel"
             data-favorites-search-input="favorite-foods-search-input"
             data-favorites-search-empty="favorite-foods-search-empty"
             th:unless="${#lists.isEmpty(foods)}">
            <article class="food-favorite-card" th:each="food : ${foods}" data-remove-on-unfavorite
                     th:attr="data-search-name=${food.foodName() + ' ' + (food.description() ?: '')}">

                <img class="food-favorite-card__image" th:if="${food.imageUrl() != null}"
                     th:src="${food.imageUrl()}" th:alt="${food.foodName()}">

                <div class="food-favorite-card__body">
                    <h2 class="food-favorite-card__title" th:text="${food.foodName()}">음식명</h2>
                    <p class="food-favorite-card__desc" th:if="${food.description() != null}"
                       th:text="${food.description()}">소개</p>

                    <p class="food-favorite-card__recipe" th:if="${food.recipe() != null}"
                       th:text="${food.recipe()}">레시피 본문</p>

                    <a class="food-favorite-card__link" th:if="${food.recipeUrl() != null}"
                       th:href="${food.recipeUrl()}" target="_blank" rel="noopener noreferrer">
                        레시피 참고 링크 →
                    </a>
                </div>

                <div class="food-favorite-card__footer">
                    <button type="button" class="favorite-toggle is-favorited"
                            th:attr="data-favorite-url=@{'/info/food/' + ${food.recommendationId()} + '/favorite'}"
                            data-favorited="true" aria-pressed="true">
                        <span class="favorite-toggle__icon"></span>
                        <span class="favorite-toggle__label">즐겨찾기됨</span>
                    </button>
                </div>

            </article>
        </div>

        <div id="food-infinite-sentinel" class="favorites-infinite-sentinel" th:unless="${#lists.isEmpty(foods)}"></div>

        <p class="favorites-more" th:unless="${#lists.isEmpty(foods)}">
            <a th:href="@{/info/food}">다른 사찰음식 보러가기 →</a>
        </p>

    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

<script defer th:src="@{/js/buddhism/favoriteButton.js}"></script>
<script defer th:src="@{/js/mypage/favoritesInfiniteScroll.js}"></script>

</body>
</html>
