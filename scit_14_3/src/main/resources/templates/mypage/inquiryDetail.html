<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="stylesheet" th:href="@{/css/common.css}" type="text/css">
    <link rel="stylesheet" th:href="@{/css/mypage/mypage.css}" type="text/css">
    <title>문의 상세 · 佛선자</title>
    <style>
        .page-title {
          margin: 0 0 20px;
          font-family: var(--serif);
          font-weight: 500;
          font-size: 21px;
          color: var(--text-primary);
        }

        .inquiry-detail-wrap { max-width: 760px; margin: 0 auto; }

        .back-btn {
          display: inline-block;
          margin-bottom: 18px;
          background: var(--paper);
          border: 1px solid var(--line);
          color: var(--text-primary);
          font-size: 14px;
          font-weight: 600;
          font-family: var(--sans);
          cursor: pointer;
          padding: 11px 20px;
          border-radius: 999px;
        }
        .back-btn:hover { border-color: rgba(39, 33, 27, 0.25); background: var(--secondary); }

        .detail-card {
          background: var(--paper);
          border: 1px solid var(--line);
          border-radius: 12px;
          overflow: hidden;
        }
        .detail-hero { background: var(--secondary); padding: 36px 32px; }
        .hero-top-row {
          display: flex;
          align-items: flex-start;
          justify-content: space-between;
          gap: 16px;
          margin-bottom: 6px;
        }
        .hero-title-row {
          display: flex;
          align-items: flex-end;
          justify-content: space-between;
          gap: 16px;
        }
        .detail-hero h4 {
          margin: 0;
          font-size: 12.5px;
          font-weight: 700;
          letter-spacing: .02em;
          color: var(--text-tertiary);
        }
        .hero-title-text {
          margin: 0;
          font-size: 16.5px;
          line-height: 1.6;
          color: var(--text-primary);
          word-break: break-word;
        }
        .hero-date { margin: 0; flex-shrink: 0; font-size: 13px; color: var(--text-secondary); }

        .detail-section { padding: 28px 32px; border-top: 1px solid var(--line); }
        .detail-section h4 {
          margin: 0 0 14px;
          font-size: 12.5px;
          font-weight: 700;
          letter-spacing: .02em;
          color: var(--text-tertiary);
        }
        .detail-section p {
          margin: 0;
          font-size: 14.5px;
          line-height: 1.8;
          color: var(--text-primary);
          white-space: pre-wrap;
          word-break: break-word;
        }
        .detail-section.answer { background: rgba(92, 122, 98, .06); }
        .detail-section.no-answer p { color: var(--text-tertiary); }

        .status-badge {
          display: inline-block;
          padding: 3px 11px;
          border-radius: 999px;
          font-size: 11.5px;
          font-weight: 600;
          letter-spacing: .01em;
        }
        .status-대기     { background: var(--muted-bg); color: var(--text-tertiary); }
        .status-답변완료 { background: rgba(92, 122, 98, .13); color: var(--green); }
    </style>
</head>
<body>

<div id="auth-info" style="display:none;"
     sec:authorize="isAuthenticated()"
     th:attr="data-login-id=${#authentication.principal.username}">
</div>

<header>
    <div th:replace="~{fragments/common-includes :: commonIncludes}"></div>
</header>

<main class="mypage-main">
    <div class="mypage-inner">
        <div class="inquiry-detail-wrap">
            <a class="back-btn" th:href="@{/mypage/inquiries}">← 목록으로</a>

            <div class="detail-card">
                <div class="detail-hero">
                    <div class="hero-top-row">
                        <h4>제목</h4>
                        <span class="status-badge" th:classappend="'status-' + ${inquiry.status}" th:text="${inquiry.status}"></span>
                    </div>
                    <div class="hero-title-row">
                        <p class="hero-title-text" th:text="${inquiry.title}"></p>
                        <p class="hero-date" th:text="${#temporals.format(inquiry.createdAt, 'yyyy.MM.dd HH:mm')}"></p>
                    </div>
                </div>
                <div class="detail-section">
                    <h4>문의 내용</h4>
                    <p th:text="${inquiry.content}"></p>
                </div>
                <div class="detail-section answer" th:if="${inquiry.status.name() == '답변완료'}">
                    <h4>관리자 답변</h4>
                    <p th:text="${inquiry.answer}"></p>
                </div>
                <div class="detail-section no-answer" th:if="${inquiry.status.name() != '답변완료'}">
                    <p>아직 답변이 등록되지 않았습니다.</p>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
