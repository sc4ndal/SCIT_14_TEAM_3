<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>온라인 목탁회</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/moktak/moktak.css}">
</head>
<body>


<div id="top-controls">
    <button id="soundToggleBtn" type="button" aria-label="소리 켜기/끄기">🔊</button>
    <button id="resetBtn" type="button" aria-label="카운터 초기화">초기화</button>
    <a id="homeLink" th:href="@{/}" aria-label="메인으로">메인으로</a>
    <div class="custom-select" id="soundSelectWrap">
        <button type="button" class="custom-select-btn" id="soundSelectBtn" aria-haspopup="listbox" aria-expanded="false">
            <span id="soundSelectLabel">소리 1</span>
            <svg width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <ul class="custom-select-list" id="soundSelectList" role="listbox" hidden>
            <li role="option" data-value="0" class="active">소리 1</li>
            <li role="option" data-value="1">소리 2</li>
            <li role="option" data-value="2">소리 3</li>
        </ul>
    </div>
</div>

<div class="heading">
    <h1>온라인 목탁회</h1>
    <p>잠시 마음을 가라앉히고 목탁을 울려보세요</p>
</div>

<div class="participant-count" id="participantCount">🟢 참여자 수 확인 중...</div>

<div class="design-label" id="designLabel"></div>

<div class="stage-outer">
    <button class="nav-arrow" id="prevBtn" aria-label="이전 디자인">
        <svg width="10" height="16" viewBox="0 0 10 16" fill="none">
            <path d="M8 2L2 8L8 14" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>
    <div class="stage-wrap" id="stageWrap">
        <!-- 흘러가는 댓글: 목탁 위쪽에 겹쳐지는 레이어 -->
        <div id="chatFlow" aria-hidden="true"></div>

        <div class="stage" id="stage">
            <img class="layer" id="cushion" alt="">
            <img class="layer" id="moktak-body" alt="목탁">
        </div>
    </div>

    <button class="nav-arrow" id="nextBtn" aria-label="다음 디자인">
        <svg width="10" height="16" viewBox="0 0 10 16" fill="none">
            <path d="M2 2L8 8L2 14" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>
</div>

<div class="dots" id="dots"></div>

<div class="counter">
    오늘의 목탁 <b id="hit-count">0</b> / 108
    <button id="infoBtn" type="button" aria-label="108의 의미">ⓘ</button>
</div>

<div id="infoPopover" hidden>
    불교에서 108은 인간이 가진 여러 번뇌를 상징하는 숫자로 알려져 있습니다.
    목탁을 치며 자신의 마음을 돌아보는 의미를 담았습니다.
</div>

<div class="hint">스와이프하거나 화살표(← →)로 디자인을 바꾸고, 목탁을 클릭해보세요</div>

<div id="chatInputBar">
    <input id="chatInput" type="text" maxlength="60" placeholder="소근소근 말하기...">
</div>

<div id="credit">
    목탁 소리 출처: 김용배
    (<a href="https://gongu.copyright.or.kr/gongu/wrt/wrt/view.do?wrtSn=13253416&menuNo=200020" target="_blank" rel="noopener">공유마당</a>,
    한국저작권위원회, CC BY)
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const WS_URL = /*[[@{/ws/moktak}]]*/ '/ws/moktak';
    const IMAGE_BASE = /*[[@{/images/moktak}]]*/ '/images/moktak';
    const SOUND_URLS = [
        /*[[@{/sounds/moktak/moktakHit.mp3}]]*/ '/sounds/moktak/moktakHit.mp3',
        /*[[@{/sounds/moktak/moktakHit2.mp3}]]*/ '/sounds/moktak/moktakHit2.mp3',
        /*[[@{/sounds/moktak/moktakHit3.mp3}]]*/ '/sounds/moktak/moktakHit3.mp3'
    ];
    /*]]>*/
</script>
<script th:src="@{/js/moktak/moktak.js}"></script>
</body>
</html>
