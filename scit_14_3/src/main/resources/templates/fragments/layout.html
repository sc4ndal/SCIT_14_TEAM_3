<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
	알아보기 화면들이 함께 쓰는 헤더/푸터 조각.
	팀 공통 네비게이션이 확정되면 이 파일만 갈아끼우면 된다.
-->
<body>

<!-- class를 site-header가 아니라 subnav로 둔 이유: commonIncludes(fragments/common-includes.html)의
     루트 div도 site-header 클래스를 쓰는데, 이 헤더는 그 아래 얹혀서 같이 떠 있는 서브 내비게이션이라
     이름이 겹치면 CSS(position:fixed vs sticky)가 서로 덮어써서 둘 다 깨짐. -->
<header th:fragment="header" class="subnav">
	<div class="subnav__inner">
		<a class="subnav__logo" th:href="@{/}">산문(山門)</a>
		<nav class="subnav__nav">
			<a th:href="@{/info/intro}">불교란?</a>
			<a th:href="@{/info/terms}">불교 용어</a>
			<a th:href="@{/findtemple}">사찰 찾기</a>
			<a th:href="@{/templestayGuide}">템플스테이</a>
		</nav>
	</div>
</header>

<footer th:fragment="footer" class="site-footer no-translate">
	<p>SCIT 14기 3조 · 불교 종합 사이트</p>
	<p class="site-footer__sub">이 페이지의 설명은 불교를 처음 접하는 분을 위해 쉽게 간추린 것입니다.</p>
</footer>

</body>
</html>
