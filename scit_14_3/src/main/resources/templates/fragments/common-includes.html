<!--
    <div th:replace="~{fragments/common-includes :: commonIncludes}"></div>
    모든 html에 삽입 - common.js도 이 안에 같이 들어있어서 페이지마다 따로 <script> 안 넣어도 됨
    (언어 버튼/드롭다운 등은 common.js가 이 마크업을 대상으로 동작함)

-->

<div class="site-header" id="siteHeader" th:fragment="commonIncludes">
    <div class="header-inner">

        <a class="brand" href="/">

            <span class="brand-circle">
                禪
            </span>

            <span class="brand-name">
                佛선자
            </span>

        </a>


        <div class="header-right">

            <div class="language-area">


                <button class="language-button active"
                        data-lang="ko"
                        type="button">
                    한국어
                </button>

                <span>·</span>

                <button class="language-button"
                        data-lang="ja"
                        type="button">
                    日本語
                </button>

                <span>·</span>

                <button class="language-button"
                        data-lang="en"
                        type="button">
                    English
                </button>

            </div>


            <span class="header-divider"></span>


            <nav class="member-menu">

                <!-- ============================
                            미로그인 상태
                ================================= -->
                <div class="guest-menu"
                     sec:authorize="isAnonymous()">

                    <a th:href="@{/signupSelect}">
                        회원가입
                    </a>

                    <a th:href="@{/login}">
                        로그인
                    </a>
                </div>

                <!-- ============================
                            로그인 상태
                ================================= -->
                <div class="userEntity-menu"
                     sec:authorize="isAuthenticated()">

                    <!-- 아이콘 + 닉네임 + 로그아웃 (한 줄) -->
                    <div class="userEntity-identity">

                        <!-- 프로필 아이콘은 컬럼 추가 부담으로 빼기로 결정 (2026-08-26) -->

                        <!-- 닉네임에 마우스 올리면 마이페이지 드롭다운이 바로 아래로 뜸(별도 트리거 행 없앰) -->
                        <div class="mypage-menu">
                            <!-- 일반회원은 법명, 사찰계정은 사찰명 (AppUserDetails.getNickname()) -->
                            <span class="userEntity-nickname"
                                  th:text="${#authentication.principal.nickname}">
                                닉네임명
                            </span>
                            <!-- 사찰 등록 요청 대기 알림 - 드롭다운 열지 않아도 바로 보이도록 닉네임 우측상단에 표시 -->
                            <span class="notice-dot nickname-dot" sec:authorize="hasRole('ADMIN')"
                                  th:if="${pendingTempleRequestCount > 0}"></span>

                            <!-- 일반회원/사찰계정: 기존 8개 그대로 -->
                            <div class="mypage-dropdown" sec:authorize="!hasRole('ADMIN')">

                            <a th:href="@{/mypage/edit}">
                                회원정보수정
                            </a>
                            <a th:href="@{/mypage/myReservations}">
                                예약목록
                            </a>
                            <a th:href="@{/mypage/myReviews}">
                                내가 쓴 리뷰
                            </a>
                            <a th:href="@{/mypage/favorites/temples}">
                                관심 사찰
                            </a>
                            <a th:href="@{/mypage/favorites/events}">
                                관심 행사
                            </a>
                            <a th:href="@{/mypage/favorites/quotes}">
                                저장한 불교 한마디
                            </a>
                            <a th:href="@{/mypage/favorites/foods}">
                                관심 사찰음식
                            </a>
                            <a th:href="@{/mypage/favorites/reviews}">
                                좋아요한 리뷰
                            </a>

                            </div>

                            <!-- 사이트 관리자: 예약/리뷰/관심 등 일반회원 전용 기능은 필요없어서 뺌 -->
                            <div class="mypage-dropdown" sec:authorize="hasRole('ADMIN')">

                                <a th:href="@{/admin/manage}">
                                    관리
                                </a>
                                <a th:href="@{/admin/temple-requests}" class="notice-link">
                                    <span>사찰 등록 요청 목록</span>
                                    <span class="notice-dot" th:if="${pendingTempleRequestCount > 0}"></span>
                                </a>

                            </div>
                        </div>

                        <span class="identity-divider"></span>

                        <!-- 로그아웃 -->
                        <form th:action="@{/logout}"
                              method="post"
                              class="logout-form">

                            <button type="submit"
                                    class="logout-button">
                                로그아웃
                            </button>
                        </form>

                    </div>

                </div>

            </nav>

        </div>

    </div>

    <script defer src="/js/common.js"></script>
</div>

<!--
    <div th:insert="~{fragments/common-includes :: languageOnly}"></div>
    로고/로그인/회원가입 없이 언어 전환 버튼 + common.js만 필요한 페이지용
    (예: EtiquetteSimulation처럼 전체화면 독립 UI라 사이트 헤더를 못 쓰는 곳).
    th:insert로 써서 감싸는 요소에 위치 지정용 클래스를 따로 줄 수 있음.
-->
<div class="language-area" th:fragment="languageOnly">
    <button class="language-button active" data-lang="ko" type="button">한국어</button>
    <span>·</span>
    <button class="language-button" data-lang="ja" type="button">日本語</button>
    <span>·</span>
    <button class="language-button" data-lang="en" type="button">English</button>
    <script defer src="/js/common.js"></script>
</div>
