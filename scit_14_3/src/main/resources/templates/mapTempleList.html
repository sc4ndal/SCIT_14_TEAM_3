<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <!-- 카카오맵 SDK -->
    <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=4d97c12d7e3e28e5dd08a2f00a58025d&libraries=services"></script>
    <style>
        /* 지도랑 상세정보 패널을 나란히 배치 */
        .wrap { display: flex; }
        #map { width: 500px; height: 400px; }
        #detail-panel {
            width: 300px;
            height: 400px;
            padding: 16px;
            border-left: 1px solid #ddd;
            display: none; /* 처음엔 숨김, 마커 클릭하면 보여줄 것 */
        }
    </style>
</head>
<body>

<div class="wrap">
    <div id="map"></div>
    <div id="detail-panel">
        <h3 id="detail-name"></h3>
        <p id="detail-address"></p>
    </div>
</div>

<!-- 분리한 지도 스크립트 -->
<script src="/js/map.js"></script>
</body>
</html>
