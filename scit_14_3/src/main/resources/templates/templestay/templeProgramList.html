<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>사찰 프로그램 관리 · 사찰 커뮤니티</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/signup.css}">
	<link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>

<div class="card" style="max-width:1100px;">
	<div th:replace="~{fragments/common-includes :: commonIncludes}"></div>

	<div class="header" style="padding-bottom:16px;">
		<h1>사찰 프로그램 관리</h1>
		<p>우리 사찰이 등록한 템플스테이 프로그램 목록입니다</p>
	</div>

	<p class="check-result" style="color:#2f6b5e; text-align:center; margin:16px 32px 0;" th:if="${manageSuccess}" th:text="${manageSuccess}"></p>
	<p class="check-result" style="color:var(--destructive); text-align:center; margin:16px 32px 0;" th:if="${manageError}" th:text="${manageError}"></p>

	<div style="padding:0 32px;">
		<a class="btn-check" th:href="@{/temple/programs/new}">+ 새 프로그램 등록</a>
	</div>

	<div class="admin-table-wrap" style="margin-top:16px;padding-bottom:32px;">
		<p th:if="${#lists.isEmpty(programs)}" style="text-align:center; color:var(--ink-soft); padding:24px 0;">
			등록된 프로그램이 없습니다.
		</p>
		<table class="admin-table" th:if="${!#lists.isEmpty(programs)}">
			<thead>
			<tr>
				<th>제목</th>
				<th>유형</th>
				<th>체류기간</th>
				<th>모집기간</th>
				<th>가격</th>
				<th>최대 인원</th>
				<th>등록일</th>
				<th></th>
			</tr>
			</thead>
			<tbody>
			<tr th:each="p : ${programs}">
				<td th:text="${p.title}"></td>
				<td th:text="${p.programType}"></td>
				<td th:text="${p.duration}"></td>
				<td th:text="${#temporals.format(p.openStartDate, 'yyyy-MM-dd')} + ' ~ ' + ${#temporals.format(p.openEndDate, 'yyyy-MM-dd')}"></td>
				<td th:text="${#numbers.formatInteger(p.price, 0, 'COMMA')} + '원'"></td>
				<td th:text="${p.maxParticipant} + '명'"></td>
				<td th:text="${#temporals.format(p.createdAt, 'yyyy-MM-dd')}"></td>
				<td>
					<div class="row-actions">
						<a th:href="@{/temple/programs/{id}/edit(id=${p.programId})}">수정</a>
						<form th:action="@{/temple/programs/{id}/delete(id=${p.programId})}" method="post" style="margin:0;"
						      onsubmit="return confirm('이 프로그램을 삭제하시겠습니까?');">
							<button type="submit" class="danger">삭제</button>
						</form>
					</div>
				</td>
			</tr>
			</tbody>
		</table>
	</div>
</div>

</body>
</html>
