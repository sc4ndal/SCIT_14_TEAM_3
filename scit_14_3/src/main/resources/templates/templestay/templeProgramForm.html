<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title th:text="${editMode} ? '사찰 프로그램 수정 · 사찰 커뮤니티' : '사찰 프로그램 등록 · 사찰 커뮤니티'">사찰 프로그램 등록 · 사찰 커뮤니티</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/signup.css}">
	<link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>

<div class="card">
	<div th:replace="~{fragments/common-includes :: commonIncludes}"></div>

	<div class="header">
		<h1 th:text="${editMode} ? '사찰 프로그램 수정' : '사찰 프로그램 등록'">사찰 프로그램 등록</h1>
		<p>우리 사찰에서 진행할 템플스테이 프로그램 정보를 입력해주세요</p>
		<p class="req-note"><span class="req">*</span> 표시는 필수 입력 항목입니다</p>
	</div>

	<p class="check-result" style="color:#b3402f; text-align:center;" th:if="${formError}" th:text="${formError}"></p>

	<form class="page-form"
	      th:action="${editMode} ? @{/temple/programs/{id}(id=${formData.programId})} : @{/temple/programs}"
	      th:object="${formData}" method="post" enctype="multipart/form-data">

		<fieldset>
			<legend>프로그램 정보</legend>

			<div class="field">
				<label for="title">제목<span class="req">*</span></label>
				<input type="text" id="title" th:field="*{title}" maxlength="100" required>
			</div>

			<div class="field">
				<label for="programType">유형<span class="req">*</span></label>
				<select id="programType" th:field="*{programType}" required>
					<option value="당일형">당일형 (당일 진행)</option>
					<option value="체험형">체험형 (1박 2일)</option>
					<option value="휴식형">휴식형 (1박 2일)</option>
				</select>
				<p class="hint">진행 기간은 유형에 따라 자동으로 정해집니다 (당일형=당일, 체험형/휴식형=1박 2일)</p>
			</div>

			<div class="field field-inline">
				<div style="flex:1;">
					<label for="openStartDate">모집 시작일<span class="req">*</span></label>
					<input type="date" id="openStartDate" th:field="*{openStartDate}" required>
				</div>
				<div style="flex:1;">
					<label for="openEndDate">모집 종료일<span class="req">*</span></label>
					<input type="date" id="openEndDate" th:field="*{openEndDate}" required>
				</div>
			</div>

			<div class="field">
				<label for="price">참가 비용(원, 1인 기준)<span class="req">*</span></label>
				<input type="number" id="price" th:field="*{price}" min="0" required>
			</div>

			<div class="field">
				<label for="imageFile">대표 이미지<span class="req">*</span></label>
				<input type="file" id="imageFile" name="imageFile" accept="image/*" th:required="${!editMode}">
				<p class="hint">최대 10MB까지 업로드 가능합니다<span th:if="${editMode}"> - 새로 고르지 않으면 기존 이미지를 그대로 씁니다</span></p>
				<div th:if="${editMode}">
					<input type="hidden" name="existingImageUrl" th:value="${formData.imageUrl}">
					<img id="imagePreview" alt="" th:src="${formData.imageUrl}"
					     style="display:block;max-width:220px;margin-top:8px;border-radius:4px;border:1px solid var(--border);">
				</div>
			</div>

			<div class="field">
				<label for="description">소개 <span class="optional-note">(선택)</span></label>
				<textarea id="description" th:field="*{description}" rows="3" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:4px;font-family:inherit;font-size:14px;"></textarea>
			</div>

			<div class="field">
				<label for="schedule">일정표 <span class="optional-note">(선택)</span></label>
				<textarea id="schedule" th:field="*{schedule}" rows="4" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:4px;font-family:inherit;font-size:14px;"></textarea>
			</div>

			<div class="field">
				<label for="requiredItems">준비물 <span class="optional-note">(선택)</span></label>
				<textarea id="requiredItems" th:field="*{requiredItems}" rows="3" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:4px;font-family:inherit;font-size:14px;"></textarea>
			</div>

			<p class="hint">
				환불 규정·유의사항은 프로그램마다 따로 입력하지 않고 사찰 공통으로 한 번만 등록합니다 -
				<a th:href="@{/mypage/edit}">사찰정보수정에서 설정하러 가기</a>
			</p>
		</fieldset>

		<div class="form-actions">
			<button class="submit" type="submit" th:text="${editMode} ? '수정' : '등록'">등록</button>
			<a th:href="@{/temple/programs}" class="btn-cancel">취소</a>
		</div>
	</form>
</div>

<script>
	// 모집 종료일이 시작일보다 빠르면 안 됨 - 시작일 고르면 종료일 최소값을 그만큼 밀어줌
	const openStartInput = document.getElementById('openStartDate');
	const openEndInput = document.getElementById('openEndDate');
	openStartInput.addEventListener('change', () => {
		openEndInput.min = openStartInput.value;
		if (openEndInput.value && openEndInput.value < openStartInput.value) {
			openEndInput.value = openStartInput.value;
		}
	});

	// 수정 화면에서 새 이미지를 고르면 미리보기 갱신(실제 업로드는 저장 시 서버에서 처리)
	const imageFileInput = document.getElementById('imageFile');
	const imagePreview = document.getElementById('imagePreview');
	if (imagePreview) {
		imageFileInput.addEventListener('change', () => {
			const file = imageFileInput.files[0];
			if (!file) return;
			const reader = new FileReader();
			reader.onload = () => { imagePreview.src = reader.result; };
			reader.readAsDataURL(file);
		});
	}
</script>

</body>
</html>
