<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>템플스테이 후기 · 사찰 커뮤니티</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/templestay/reviews.css}">
</head>
<body>

<div id="auth-info" style="display:none;"
     sec:authorize="isAuthenticated()"
     th:attr="data-login-id=${#authentication.principal.username}, data-temple-account=${#authentication.principal.templeAccount}">
</div>
<!-- 관리자 계정 + 사찰 계정은 좋아요를 못 쓰게 서버(ReviewController)에서 막아뒀다 - reviews.js가
     카드를 JS로 직접 그리므로(renderItem), 존재 여부만으로 판별하는 #auth-info와 같은 방식으로
     이 표식을 두고 좋아요 버튼 자체를 안 그리게 한다(사찰 계정은 #auth-info의 data-temple-account로 판별). -->
<div id="admin-info" style="display:none;" sec:authorize="hasRole('ADMIN')"></div>

<header>
    <div th:replace="~{fragments/common-includes :: commonIncludes}"></div>
    <h1 data-pi18n="revPageTitle">템플스테이 후기</h1>
</header>

<main>
    <a class="back-link" th:href="@{/reservation}" data-pi18n="revBack">&larr; 템플스테이 예약</a>

    <div id="review-list">
        <div class="review-empty" data-pi18n="revLoadingMsg">후기를 불러오는 중입니다&hellip;</div>
    </div>

    <div class="review-toolbar">
        <select id="review-sort" aria-label="정렬" data-pi18n-aria="revSortAria">
            <option value="latest" data-pi18n="sortLatest">최신순</option>
            <option value="oldest" data-pi18n="sortOldest">오래된순</option>
            <option value="rating-desc" data-pi18n="sortRatingDesc">별점 높은순</option>
            <option value="rating-asc" data-pi18n="sortRatingAsc">별점 낮은순</option>
        </select>
        <input type="text" id="review-search" class="search-input" data-pi18n-placeholder="revSearchPh" data-pi18n-aria="revSearchAria" aria-label="검색" placeholder="사찰명 · 프로그램명 · 작성자 · 내용 검색">
        <button type="button" id="review-search-btn" class="search-btn" data-pi18n="revSearchBtn">검색</button>
    </div>

    <div id="review-pagination"></div>
</main>

<script th:src="@{/js/temple/templeI18n.js}"></script>
<script th:src="@{/js/templestay/programI18n.js}"></script>
<script defer th:src="@{/js/templestay/reviews.js}"></script>
</body>
</html>
