<!DOCTYPE html>
<html xmlns:th="thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>템플스테이 예약</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
    <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=4d97c12d7e3e28e5dd08a2f00a58025d&libraries=services"></script>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        :root {
          --bg: #efe9dd;
          --bg-raised: #f7f3ea;
          --ink: #2a2620;
          --ink-soft: #5b5346;
          --ink-faint: #8b8272;
          --line: #d9d0bd;
          --line-soft: #e4dccb;
          --pine: #3d5646;
          --pine-deep: #2b3e33;
          --pine-tint: #e2e8e0;
          --gold: #a9822f;
          --gold-tint: #f1e6c8;
          --red: #96432f;
          --red-tint: #f0ded6;
          --shadow: 0 1px 2px rgba(42,38,32,0.06), 0 8px 24px -12px rgba(42,38,32,0.18);
        }
        @media (prefers-color-scheme: dark) {
          :root:not([data-theme="light"]) {
            --bg: #211d18;
            --bg-raised: #2a251e;
            --ink: #eee7d8;
            --ink-soft: #bcb199;
            --ink-faint: #8b8272;
            --line: #3d372c;
            --line-soft: #332e25;
            --pine: #8fae9b;
            --pine-deep: #b7cbbe;
            --pine-tint: #29352e;
            --gold: #d8b866;
            --gold-tint: #362d1c;
            --red: #d8917d;
            --red-tint: #3a241f;
            --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
          }
        }
        :root[data-theme="dark"] {
          --bg: #211d18;
          --bg-raised: #2a251e;
          --ink: #eee7d8;
          --ink-soft: #bcb199;
          --ink-faint: #8b8272;
          --line: #3d372c;
          --line-soft: #332e25;
          --pine: #8fae9b;
          --pine-deep: #b7cbbe;
          --pine-tint: #29352e;
          --gold: #d8b866;
          --gold-tint: #362d1c;
          --red: #d8917d;
          --red-tint: #3a241f;
          --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
        }

        * { box-sizing: border-box; }

        body {
          margin: 0;
          background: var(--bg);
          color: var(--ink);
          font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
          line-height: 1.65;
          font-size: 15.5px;
        }

        h1, h2, h3 {
          font-family: "Noto Serif KR", "Batang", serif;
          color: var(--ink);
          text-wrap: balance;
          font-weight: 700;
          margin: 0;
        }

        .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }

        button { font-family: inherit; }

        /* ---------- Header ---------- */
        header {
          padding: 48px 24px 0;
          text-align: center;
          border-bottom: 1px solid var(--line);
          background: radial-gradient(60% 60% at 50% 0%, var(--pine-tint), transparent 70%);
        }
        header h1 {
          font-size: clamp(26px, 4vw, 34px);
        }
        header h1::before {
          content: "TEMPLESTAY RESERVATION";
          display: block;
          font-family: "IBM Plex Mono", monospace;
          font-size: 12px;
          letter-spacing: 0.16em;
          color: var(--pine);
          font-weight: 600;
          margin-bottom: 16px;
        }

        /* ---------- Progress steps ---------- */
        #progress-steps {
          display: flex;
          justify-content: center;
          gap: 0;
          list-style: none;
          margin: 28px auto 0;
          padding: 0;
          max-width: 560px;
        }
        #progress-steps li {
          position: relative;
          flex: 1;
          text-align: center;
          padding: 22px 8px 24px;
          font-size: 13px;
          font-weight: 600;
          color: var(--ink-faint);
          font-family: "IBM Plex Mono", monospace;
          letter-spacing: 0.02em;
        }
        #progress-steps li::before {
          content: "";
          position: absolute;
          top: 5px;
          left: -50%;
          width: 100%;
          height: 2px;
          background: var(--line);
          z-index: 0;
        }
        #progress-steps li:first-child::before { display: none; }
        #progress-steps li::after {
          content: "";
          position: absolute;
          top: 0;
          left: 50%;
          transform: translateX(-50%);
          width: 12px;
          height: 12px;
          border-radius: 50%;
          background: var(--bg-raised);
          border: 2px solid var(--line);
          z-index: 1;
        }
        #progress-steps li.active {
          color: var(--pine-deep);
        }
        #progress-steps li.active::after {
          border-color: var(--pine);
          background: var(--pine);
        }
        #progress-steps li.active::before {
          background: var(--pine);
        }

        main {
          max-width: 880px;
          margin: 0 auto;
          padding: 40px 24px 96px;
        }

        section[data-step], #step-1-detail {
          animation: fade-in 0.2s ease;
        }
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        @media (prefers-reduced-motion: reduce) {
          section[data-step], #step-1-detail { animation: none; }
        }

        section > h2 {
          font-size: 22px;
          margin-bottom: 20px;
        }

        /* ---------- Filter form ---------- */
        #filter-form {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 14px;
          background: var(--bg-raised);
          border: 1px solid var(--line);
          border-radius: 14px;
          padding: 20px;
          margin-bottom: 28px;
          box-shadow: var(--shadow);
        }
        @media (max-width: 720px) {
          #filter-form { grid-template-columns: 1fr 1fr; }
        }
        .filter-item {
          display: flex;
          flex-direction: column;
          gap: 6px;
        }
        .filter-item label {
          font-size: 12px;
          font-weight: 600;
          color: var(--ink-faint);
          letter-spacing: 0.03em;
        }
        select, input[type="text"], input[type="email"], input[type="tel"], input[type="number"], textarea {
          font-family: inherit;
          font-size: 14.5px;
          color: var(--ink);
          background: var(--bg);
          border: 1px solid var(--line);
          border-radius: 8px;
          padding: 9px 11px;
          width: 100%;
        }
        select:focus, input:focus, textarea:focus {
          outline: none;
          border-color: var(--pine);
          box-shadow: 0 0 0 3px color-mix(in srgb, var(--pine) 18%, transparent);
        }

        /* ---------- Program list ---------- */
        #program-list {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
          gap: 16px;
          margin-top: 12px;
        }

        .program-card {
          border: 1px solid var(--line);
          border-radius: 14px;
          padding: 20px;
          cursor: pointer;
          background: var(--bg-raised);
          transition: border-color 0.15s ease, transform 0.15s ease;
          display: flex;
          flex-direction: column;
          gap: 10px;
        }
        .program-card:hover {
          border-color: var(--pine);
          transform: translateY(-2px);
        }
        .program-card.picked {
          border: 2px solid var(--pine);
          background-color: var(--pine-tint);
        }
        @media (prefers-reduced-motion: reduce) {
          .program-card { transition: none; }
          .program-card:hover { transform: none; }
        }

        .program-type-badge {
          display: inline-flex;
          align-self: flex-start;
          font-family: "IBM Plex Mono", monospace;
          font-size: 11.5px;
          font-weight: 600;
          color: var(--gold);
          background: var(--gold-tint);
          border-radius: 100px;
          padding: 3px 10px;
        }
        .program-title {
          font-family: "Noto Serif KR", serif;
          font-size: 17px;
          font-weight: 700;
        }
        .program-temple-region {
          font-size: 13px;
          color: var(--ink-soft);
          margin: -6px 0 0;
        }
        .program-price {
          margin-top: auto;
        }
        .price-adult {
          font-family: "IBM Plex Mono", monospace;
          font-variant-numeric: tabular-nums;
          font-weight: 600;
          color: var(--pine-deep);
          font-size: 15px;
        }
        .price-minor {
          font-size: 12.5px;
          color: var(--ink-faint);
          margin-left: 6px;
        }
        .program-detail-btn {
          align-self: flex-start;
          background: none;
          border: 1px solid var(--line);
          color: var(--ink-soft);
          border-radius: 8px;
          padding: 7px 13px;
          font-size: 13px;
          font-weight: 600;
          cursor: pointer;
        }
        .program-detail-btn:hover {
          border-color: var(--pine);
          color: var(--pine-deep);
        }

        /* ---------- Buttons (shared) ---------- */
        .btn-primary, #go-to-reserve-btn, #step2-submit-btn, #detail-reserve-btn {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          background: var(--pine);
          color: var(--bg-raised);
          font-weight: 700;
          font-size: 15px;
          border: none;
          padding: 13px 26px;
          border-radius: 100px;
          cursor: pointer;
          box-shadow: var(--shadow);
          transition: transform 0.15s ease, opacity 0.15s ease;
        }
        .btn-primary:hover, #go-to-reserve-btn:not(:disabled):hover,
        #step2-submit-btn:hover, #detail-reserve-btn:hover {
          transform: translateY(-1px);
        }
        #go-to-reserve-btn:disabled {
          background: var(--line);
          color: var(--ink-faint);
          cursor: not-allowed;
          box-shadow: none;
        }
        #go-to-reserve-btn { margin-top: 24px; }

        .btn-ghost, #detail-back-to-list-btn, #step2-back-btn,
        #step3-back-to-list-btn, #go-to-my-reservations-btn {
          background: none;
          border: 1px solid var(--line);
          color: var(--ink-soft);
          font-weight: 600;
          font-size: 14px;
          padding: 11px 22px;
          border-radius: 100px;
          cursor: pointer;
        }
        .btn-ghost:hover, #detail-back-to-list-btn:hover, #step2-back-btn:hover,
        #step3-back-to-list-btn:hover, #go-to-my-reservations-btn:hover {
          border-color: var(--pine);
          color: var(--pine-deep);
        }
        #go-to-my-reservations-btn {
          border-color: var(--pine);
          color: var(--pine-deep);
        }
        @media (prefers-reduced-motion: reduce) {
          .btn-primary, #go-to-reserve-btn, #step2-submit-btn, #detail-reserve-btn { transition: none; }
        }

        /* ---------- Step 1 detail ---------- */
        #step-1-detail {
          background: var(--bg-raised);
          border: 1px solid var(--line);
          border-radius: 16px;
          padding: 28px;
          box-shadow: var(--shadow);
        }
        .detail-title {
          font-size: 24px;
          margin-top: 14px;
        }
        .detail-sub {
          font-size: 13.5px;
          color: var(--ink-soft);
          margin: 6px 0 24px;
        }
        .detail-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 18px;
        }
        @media (max-width: 640px) {
          .detail-grid { grid-template-columns: 1fr; }
        }
        .d-block {
          border: 1px solid var(--line-soft);
          border-radius: 12px;
          padding: 16px 18px;
          background: var(--bg);
        }
        .d-block h3 {
          font-size: 13px;
          font-family: "Noto Sans KR", sans-serif;
          letter-spacing: 0.03em;
          color: var(--pine);
          margin-bottom: 8px;
        }
        .d-block p, .d-block li {
          font-size: 14px;
          color: var(--ink-soft);
        }
        #detail-schedule p {
          margin: 0 0 6px;
          font-family: "IBM Plex Mono", monospace;
          font-size: 12.5px;
        }
        #detail-required-items {
          margin: 0;
          padding-left: 18px;
        }
        .price-table {
          width: 100%;
          border-collapse: collapse;
          font-size: 14px;
        }
        .price-table th, .price-table td {
          text-align: left;
          padding: 8px 4px;
          border-bottom: 1px solid var(--line-soft);
        }
        .price-table th {
          color: var(--ink-faint);
          font-weight: 600;
          font-size: 12px;
        }
        #detail-price {
          font-family: "IBM Plex Mono", monospace;
          font-weight: 600;
          color: var(--pine-deep);
        }
        #step-1-detail > #detail-reserve-btn {
          margin-top: 22px;
        }

        /* ---------- Step 2 ---------- */
        #selected-program-summary {
          background: var(--pine-tint);
          border: 1px solid color-mix(in srgb, var(--pine) 30%, var(--line));
          border-radius: 12px;
          padding: 16px 20px;
          margin-bottom: 24px;
          display: flex;
          flex-wrap: wrap;
          gap: 4px 18px;
          align-items: baseline;
        }
        #selected-program-summary .program-title { font-size: 16px; }
        #selected-program-summary .program-temple-region { margin: 0; font-size: 13px; }
        #selected-program-summary .program-price {
          font-family: "IBM Plex Mono", monospace;
          font-weight: 600;
          color: var(--pine-deep);
          font-size: 13.5px;
        }

        #reservation-form {
          display: flex;
          flex-direction: column;
          gap: 24px;
        }
        .form-item {
          display: flex;
          flex-direction: column;
          gap: 6px;
          margin-bottom: 12px;
        }
        .form-item label {
          font-size: 13px;
          font-weight: 600;
          color: var(--ink-soft);
        }
        textarea { min-height: 80px; resize: vertical; }

        /* ---------- Calendar ---------- */
        #reservation-calendar {
          width: 100%;
          border: 1px solid var(--line);
          border-radius: 14px;
          padding: 20px;
          background: var(--bg-raised);
        }
        .cal-head {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 10px;
        }
        .cal-head button {
          background: none;
          border: 1px solid var(--line);
          border-radius: 8px;
          width: 30px;
          height: 30px;
          cursor: pointer;
          color: var(--ink-soft);
          font-size: 16px;
          line-height: 1;
        }
        .cal-head button:hover { border-color: var(--pine); color: var(--pine-deep); }
        #cal-month-label {
          font-family: "IBM Plex Mono", monospace;
          font-weight: 600;
          font-size: 14px;
        }
        .cal-grid {
          display: grid;
          grid-template-columns: repeat(7, 1fr);
          gap: 6px;
          text-align: center;
        }
        .cal-dow {
          font-size: 12.5px;
          color: var(--ink-faint);
          padding: 6px 0;
          font-weight: 600;
        }
        .cal-day {
          padding: 12px 0;
          border-radius: 8px;
          cursor: pointer;
          font-size: 14.5px;
          font-variant-numeric: tabular-nums;
        }
        .cal-day:hover { background-color: var(--pine-tint); }
        .cal-day.disabled {
          color: var(--ink-faint);
          opacity: 0.45;
          cursor: not-allowed;
        }
        .cal-day.disabled:hover { background: none; }
        .cal-day.empty { visibility: hidden; }
        .cal-day.selected {
          background-color: var(--pine);
          color: var(--bg-raised);
          font-weight: 700;
        }
        #cal-selected-range {
          margin: 12px 2px 0;
          font-size: 13px;
          color: var(--ink-soft);
        }

        /* ---------- Participants & payment ---------- */
        fieldset {
          border: 1px solid var(--line);
          border-radius: 14px;
          padding: 18px 20px;
          background: var(--bg-raised);
        }
        legend {
          font-family: "Noto Serif KR", serif;
          font-weight: 700;
          font-size: 15px;
          padding: 0 6px;
        }
        .participant-row {
          display: grid;
          grid-template-columns: 1fr 120px 1.4fr;
          gap: 12px;
          padding: 12px 0;
          border-bottom: 1px solid var(--line-soft);
        }
        .participant-row:last-child { border-bottom: none; }
        @media (max-width: 640px) {
          .participant-row { grid-template-columns: 1fr; }
        }

        #representative-info {
          border-color: color-mix(in srgb, var(--pine) 30%, var(--line));
          background: var(--pine-tint);
        }
        .representative-row {
          grid-template-columns: 1fr 100px 1.3fr 1.1fr;
          border-bottom: none;
          padding: 4px 0 0;
        }
        @media (max-width: 720px) {
          .representative-row { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 640px) {
          .representative-row { grid-template-columns: 1fr; }
        }
        .fieldset-hint {
          margin: -4px 0 12px;
          font-size: 12.5px;
          color: var(--ink-faint);
        }

        #payment-section .form-item { margin-bottom: 14px; }
        #payment-total-amount {
          font-family: "IBM Plex Mono", monospace;
          font-weight: 600;
          font-size: 15px;
          color: var(--pine-deep);
          background: var(--pine-tint);
          border-radius: 8px;
          padding: 10px 14px;
          margin-top: 8px;
        }

        #reservation-form > div:last-of-type,
        #reservation-form > fieldset + div {
          display: flex;
          gap: 12px;
          justify-content: flex-end;
        }
        #step2-back-btn, #step2-submit-btn { margin-top: 4px; }

        /* ---------- Step 3 ---------- */
        #reservation-result-summary {
          background: var(--bg-raised);
          border: 1px solid var(--line);
          border-radius: 14px;
          padding: 24px 26px;
          box-shadow: var(--shadow);
          display: flex;
          flex-direction: column;
          gap: 10px;
        }
        #reservation-result-summary p { margin: 0; font-size: 14.5px; color: var(--ink-soft); }
        #result-reservation-id {
          font-family: "IBM Plex Mono", monospace;
          font-weight: 700;
          color: var(--pine-deep);
          font-size: 16px;
        }
        #result-program-title { font-family: "Noto Serif KR", serif; font-weight: 700; font-size: 18px; color: var(--ink); }
        #result-status {
          display: inline-block;
          width: fit-content;
          font-family: "IBM Plex Mono", monospace;
          font-size: 12px;
          font-weight: 600;
          color: var(--gold);
          background: var(--gold-tint);
          border-radius: 100px;
          padding: 3px 10px;
        }
        #step-3 > button {
          margin-top: 20px;
          margin-right: 10px;
        }
    </style>
</head>
<body>
<div id="auth-info" style="display:none;"
     sec:authorize="isAuthenticated()"
     th:attr="data-login-id=${#authentication.principal.username}, data-nickname=${#authentication.principal.nickname}">
</div>
<header>
    <div th:replace="~{fragments/common-includes :: commonIncludes}"></div>

    <h1>템플스테이 예약</h1>

    <!-- 3단계 진행 표시 -->
    <ol id="progress-steps">
        <li id="step-indicator-1" class="active">01 프로그램 목록</li>
        <li id="step-indicator-2">02 예약 신청</li>
        <li id="step-indicator-3">03 신청 완료</li>
    </ol>
</header>

<main>

    <!-- ===================== STEP 1: 프로그램 목록 ===================== -->
    <section id="step-1" data-step="1">
        <h2>프로그램 목록</h2>

        <!-- 필터 영역 -->
        <form id="filter-form">
            <div class="filter-item">
                <label for="filter-region">지역</label>
                <select id="filter-region" name="region">
                    <option value="">전체</option>
                    <!-- option: 부산광역시, 울산광역시, 경상남도 등 -->
                </select>
            </div>

            <div class="filter-item">
                <label for="filter-temple">사찰</label>
                <select id="filter-temple" name="templeId">
                    <option value="">전체</option>
                    <!-- option: TEMPLE 목록 -->
                </select>
            </div>

            <div class="filter-item">
                <label for="filter-program-type">프로그램 유형</label>
                <select id="filter-program-type" name="programType">
                    <option value="">전체</option>
                    <option value="당일형">당일형</option>
                    <option value="체험형">체험형</option>
                    <option value="휴식형">휴식형</option>
                </select>
            </div>

            <div class="filter-item">
                <label for="filter-headcount">인원</label>
                <select id="filter-headcount" name="headcount">
                    <option value="">전체</option>
                    <!-- option: 1명, 2명, 3명 ... -->
                </select>
            </div>

        </form>

        <!-- 프로그램 카드 결과 목록 -->
        <div id="program-list">

            <!-- 프로그램 카드 (반복되는 구조, 예시 1개) -->
            <!-- 카드 자체를 클릭하면 선택됨(선택된 카드는 picked 클래스가 붙음), 상세보기 버튼만 예외 -->
            <article class="program-card" data-program-id="">
                <span class="program-type-badge"><!-- 당일형/체험형/휴식형 --></span>
                <h3 class="program-title"><!-- 프로그램 title --></h3>
                <p class="program-temple-region"><!-- 사찰명 · 지역 --></p>
                <div class="program-price">
                    <span class="price-adult"><!-- 성인 가격 --></span>
                    <span class="price-minor"><!-- 미성년 가격 (있다면) --></span>
                </div>
                <button type="button" class="program-detail-btn">상세보기</button>
            </article>

            <!-- 프로그램 카드가 여기에 반복 렌더링됨 -->

        </div>

        <!-- 목록에서 카드를 클릭해 선택해야 활성화되는 버튼 -->
        <button type="button" id="go-to-reserve-btn" disabled>예약 신청</button>
    </section>

    <!-- ===================== STEP 1-상세: 프로그램 상세보기 (목록 안의 서브 화면) ===================== -->
    <section id="step-1-detail" hidden>

        <button type="button" id="detail-back-to-list-btn">목록으로</button>

        <h2 class="detail-title"><!-- 프로그램 title --></h2>
        <p class="detail-sub"><!-- 사찰명 · 지역 · 프로그램유형 --></p>

        <div class="detail-grid">

            <!-- 프로그램 설명 -->
            <div class="d-block">
                <h3>프로그램 소개</h3>
                <p id="detail-description"><!-- TEMPLE_STAY_PROGRAM.description --></p>
            </div>
            <!-- 지도  -->
            <div id="detail-map" style="width:100%; height:300px;"></div>
            <!-- 일정표 -->
            <div class="d-block">
                <h3>일정표</h3>
                <div id="detail-schedule"><!-- TEMPLE_STAY_PROGRAM.schedule --></div>
            </div>

            <!-- 준비물 -->
            <div class="d-block">
                <h3>준비물</h3>
                <ul id="detail-required-items"><!-- TEMPLE_STAY_PROGRAM.required_items --></ul>
            </div>

            <!-- 요금 안내 -->
            <div class="d-block">
                <h3>요금 안내</h3>
                <table class="price-table">
                    <tr><th>구분</th><th>가격</th></tr>
                    <tr><td>1인</td><td id="detail-price"><!-- price --></td></tr>
                </table>
            </div>

            <!-- 유의사항 -->
            <div class="d-block">
                <h3>유의사항</h3>
                <p id="detail-precautions"><!-- TEMPLE_STAY_PROGRAM.precautions --></p>
            </div>

            <!-- 환불 규정 -->
            <div class="d-block">
                <h3>환불 규정</h3>
                <p id="detail-refund-policy"><!-- TEMPLE_STAY_PROGRAM.refund_policy --></p>
            </div>

        </div>

        <button type="button" id="detail-reserve-btn">예약 신청</button>
    </section>

    <!-- ===================== STEP 2: 예약 신청 ===================== -->
    <section id="step-2" data-step="2" hidden>
        <h2>예약 신청</h2>

        <!-- 선택된 프로그램 요약 -->
        <div id="selected-program-summary">
            <p class="program-title"></p>
            <p class="program-temple-region"></p>
            <p class="program-price"></p>
        </div>

        <form id="reservation-form">

            <!-- TEMPLE_STAY_RESERVATION 필드 -->
            <input type="hidden" id="res-login-id" name="loginId">
            <input type="hidden" id="res-program-id" name="programId">

            <div class="form-item">
                <label>희망 일정</label>
                <!-- 날짜 하나 클릭하면: 당일형은 그날 하루만, 그 외(1박2일)는 다음날까지 자동으로 선택됨 -->
                <div id="reservation-calendar">
                    <div class="cal-head">
                        <button type="button" id="cal-prev-month">‹</button>
                        <span id="cal-month-label"></span>
                        <button type="button" id="cal-next-month">›</button>
                    </div>
                    <div class="cal-grid" id="cal-grid"></div>
                </div>
                <p id="cal-selected-range">날짜를 선택해 주세요.</p>
            </div>

            <!-- 실제 제출되는 값은 이 두 hidden input에 저장됨 (달력에서 클릭하면 자동으로 채워짐) -->
            <input type="hidden" id="res-start-date" name="startDate">
            <input type="hidden" id="res-end-date" name="endDate">

            <div class="form-item">
                <label for="res-participant-count">참가 인원</label>
                <input type="number" id="res-participant-count" name="participantCount" min="1">
            </div>

            <div class="form-item">
                <label for="res-note">요청사항</label>
                <textarea id="res-note" name="note" placeholder="예) 채식 식단이 필요합니다 / 거동이 불편하여 1층 방을 희망합니다 / 반려동물 동반 문의 등 요청사항을 자유롭게 적어주세요"></textarea>
            </div>

            <!-- 대표자 정보 (예약 신청자 본인 = RESERVATION_PARTICIPANT의 첫 번째 행 + 연락처) -->
            <fieldset id="representative-info">
                <legend>대표자 정보</legend>

                <div class="participant-row representative-row" data-index="0">
                    <div class="form-item">
                        <label for="participant-name-0">이름</label>
                        <input type="text" id="participant-name-0" name="participants[0].name">
                    </div>
                    <div class="form-item">
                        <label for="participant-gender-0">성별</label>
                        <select id="participant-gender-0" name="participants[0].gender">
                            <option value="">선택</option>
                            <option value="남성">남성</option>
                            <option value="여성">여성</option>
                        </select>
                    </div>
                    <div class="form-item">
                        <label for="participant-email-0">이메일</label>
                        <input type="email" id="participant-email-0" name="participants[0].email">
                    </div>
                    <div class="form-item">
                        <label for="participant-phone-0">연락처</label>
                        <input type="tel" id="participant-phone-0" name="participants[0].phone" placeholder="예) 01012345678">
                    </div>
                </div>
            </fieldset>

            <!-- 참가자 명단 (대표자를 제외한 나머지 인원, participantCount - 1명만큼 행 반복) -->
            <fieldset id="participant-list">
                <legend>참가자 정보</legend>
                <p class="fieldset-hint">대표자를 제외한 나머지 참가자 정보를 입력해 주세요.</p>

                <!-- 참가자 행이 여기에 반복 렌더링됨 (participantCount가 1명이면 비어 있음) -->

            </fieldset>

            <!-- PAYMENT 관련 입력 -->
            <fieldset id="payment-section">
                <legend>결제 수단</legend>

                <div class="form-item">
                    <label for="payment-method">결제 방법</label>
                    <select id="payment-method" name="paymentMethod">
                        <option value="계좌이체">계좌이체</option>
                        <option value="카카오페이">카카오페이</option>
                    </select>
                </div>

                <!-- 계좌이체 선택 시 -->
                <!-- TODO: 무통장입금(수동 대사) 방식일 때만 필요한 필드. PG 연동해서 계좌이체도 즉시결제로 처리한다면 제거 검토 -->
                <div class="form-item payment-field" data-method="계좌이체">
                    <label for="payment-depositor-name">입금자명</label>
                    <input type="text" id="payment-depositor-name" name="depositorName">
                </div>

                <!-- 카카오페이 선택 시 -->
<!--                <div class="form-item payment-field" data-method="카카오페이">-->
<!--                    <label for="payment-kakao-tid">카카오페이 결제 정보</label>-->
                    <input type="hidden" id="payment-kakao-tid" name="kakaoTid">
<!--                </div>-->

                <p id="payment-total-amount"><!-- 단가 x 인원 = 총 결제 금액 --></p>
            </fieldset>

            <div>
                <button type="button" id="step2-back-btn">이전</button>
                <button type="submit" id="step2-submit-btn">예약 및 결제 신청</button>
            </div>

        </form>
    </section>

    <!-- ===================== STEP 3: 신청 완료 ===================== -->
    <section id="step-3" data-step="3" hidden>
        <h2>신청 완료</h2>

        <div id="reservation-result-summary">
            <p id="result-reservation-id"><!-- 예약번호 --></p>
            <p id="result-program-title"><!-- 프로그램명 --></p>
            <p id="result-temple-name"><!-- 사찰명 --></p>
            <p id="result-date-range"><!-- 시작일 ~ 종료일 --></p>
            <p id="result-participant-count"><!-- 참가 인원 --></p>
            <p id="result-total-amount"><!-- 총 결제 금액 --></p>
            <p id="result-payment-method"><!-- 결제 수단 --></p>
            <p id="result-status"><!-- 예약 상태: 예약대기 --></p>
        </div>
        <button type="button" id="step3-back-to-list-btn">목록으로</button>
        <button type="button" id="go-to-my-reservations-btn">내 예약 확인하기</button>
    </section>

</main>
<script src="/js/mapCommon.js"></script>
<script src="/js/templestay/templestayView.js"></script>
<script src="/js/templestay/reservation.js"></script>

</body>
</html>
