<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>불교 행사 | 佛선자</title>
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<link rel="stylesheet" th:href="@{/css/temple/events.css}">
</head>
<body>

<div id="auth-info" style="display:none;"
	 sec:authorize="isAuthenticated()"
	 th:attr="data-login-id=${#authentication.principal.username}"></div>

<header>
	<div th:replace="~{fragments/common-includes :: commonIncludes}"></div>
</header>

<main class="events-main">
	<div class="events-inner">

		<section class="events-hero">
			<span class="eyebrow no-translate"><span></span>EVENTS<span></span></span>
			<h1>불교 행사</h1>
			<p>박람회·법회·전통문화 행사 등 전국 사찰에서 열리는 불교 행사를 모았습니다.</p>
		</section>

		<div class="events-divider"></div>

		<div class="events-search" th:unless="${#lists.isEmpty(events)}">
			<input type="search" id="events-search-input" class="events-search__input"
				   placeholder="행사 이름이나 사찰 이름으로 검색 (예: 박람회, 조계사...)" autocomplete="off">
		</div>

		<p class="events-empty" th:if="${#lists.isEmpty(events)}">
			아직 등록된 행사가 없습니다.
		</p>

		<p class="events-empty" id="events-search-empty" hidden>
			검색 결과가 없습니다.
		</p>

		<div class="events-grid" id="events-grid" th:unless="${#lists.isEmpty(events)}">
			<article class="event-card" th:each="event : ${events}"
					  th:classappend="${event.past} ? ' is-past' : ''"
					  th:attr="data-event-name=${event.title + ' ' + event.templeName}">

				<div class="event-card__body">

					<div class="event-card__date">
						<span th:text="${#temporals.format(event.startDate, 'yyyy.MM.dd')}">2026.01.01</span>
						<span th:if="${event.endDate != event.startDate}"
							  th:text="'~ ' + ${#temporals.format(event.endDate, 'yyyy.MM.dd')}">~ 2026.01.07</span>
						<span class="event-card__past-badge" th:if="${event.past}">종료</span>
					</div>

					<h2 class="event-card__title" th:text="${event.title}">행사명</h2>

					<p class="event-card__temple">
						<span aria-hidden="true">⌖</span>
						<span th:text="${event.templeName}">사찰명</span>
					</p>

					<p class="event-card__desc" th:if="${event.description != null}" th:text="${event.description}">
						행사 소개
					</p>

					<a class="event-card__link" th:if="${event.linkUrl != null}" th:href="${event.linkUrl}"
					   target="_blank" rel="noopener noreferrer">
						자세히 보기 →
					</a>

				</div>

				<div class="event-card__footer">
					<button type="button" class="favorite-toggle"
							th:classappend="${event.favorited} ? 'is-favorited' : ''"
							th:attr="data-favorite-url=@{'/events/' + ${event.eventId} + '/favorite'}, aria-pressed=${event.favorited}"
							th:data-favorited="${event.favorited}">
						<span class="favorite-toggle__icon"></span>
						<span class="favorite-toggle__label" th:text="${event.favorited} ? '즐겨찾기됨' : '즐겨찾기'">즐겨찾기</span>
					</button>
				</div>

			</article>
		</div>

		<p class="events-more" th:unless="${#lists.isEmpty(events)}">
			<a th:href="@{/mypage/favorites/events}" sec:authorize="isAuthenticated()">관심 행사 모아보기 →</a>
		</p>

	</div>
</main>

<script defer th:src="@{/js/buddhism/favoriteButton.js}"></script>
<script defer th:src="@{/js/temple/events.js}"></script>

</body>
</html>
