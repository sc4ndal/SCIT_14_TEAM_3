
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>사찰 찾아보기</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <!-- 카카오맵 SDK -->
    <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=4d97c12d7e3e28e5dd08a2f00a58025d&libraries=services"></script>
    <style>
        /* 헤더(.site-header)가 position:fixed, 높이 74px라서 그만큼 밀어줌 */
        body { margin: 0; padding-top: 74px; }
        #map-wrapper {
            position: relative;
            width: 100%;
            height: calc(100vh - 74px);
        }
        #map { width: 100%; height: 100%; }
#temple-search-box {
    box-sizing: border-box;
    top: 12px;
    left: 12px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 8px;

    background: var(--paper);
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    box-shadow: 0 4px 20px rgba(39, 33, 27, .08);

    font-family: var(--sans);
    font-size: 13px;
}

#temple-search-box select,
#temple-search-box input[type="text"] {

    font-family: var(--sans);
    font-size: 13px;
    color: var(--text);

    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 7px 10px;
}

#search-keyword {
    flex: 1;
    min-width: 0;
}

#temple-search-box select:focus,
#temple-search-box input[type="text"]:focus {
    outline: none;
    border-color: var(--green);
}

#search-btn {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    color: #fff;

    background: var(--green);
    border: none;
    border-radius: 6px;
    padding: 7px 16px;

    cursor: pointer;
    transition: background .15s ease;
}

#search-btn:hover {
    background: #4a6350;
}

#type-filter-box,
#language-filter-box,
#favorite-filter-box {
    background: var(--paper);
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    box-shadow: 0 4px 20px rgba(39, 33, 27, .08);

    font-family: var(--sans);
    font-size: 13px;

    display: flex;
    flex-direction: column;
    gap: 6px;
}

#filter-favorite {
    align-self: center;

    width: 28px;
    height: 28px;
    padding: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;
    font-size: 16px;
    line-height: 1;

    background: #fff;
    border: 1px solid #f4c25c;
    color: #f4c25c;

    cursor: pointer;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
}

#filter-favorite.active {
    background: #f4c25c;
    color: #fff;
    border-color: #f4c25c;
}
.panel-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .02em;
    color: var(--text-secondary);
    white-space: nowrap;
}

#temple-filter-box {
    gap: 8px;
    flex-direction: row;
    align-items: center;
}

#temple-filter-box button,
#filter-support-english {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 700;

    background: #fff;
    border-radius: 999px;
    padding: 5px 12px;

    cursor: pointer;
    transition: background .15s ease, color .15s ease;
}

#data-type-sea { border: 1px solid var(--blue); color: var(--blue); }
#data-type-mountain { border: 1px solid var(--green); color: var(--green); }
#data-type-river { border: 1px solid var(--brown); color: var(--brown); }
#data-type-urban { border: 1px solid var(--gold); color: var(--gold); }

#data-type-sea.active { background: var(--blue); color: #fff; }
#data-type-mountain.active { background: var(--green); color: #fff; }
#data-type-river.active { background: var(--brown); color: #fff; }
#data-type-urban.active { background: var(--gold); color: #fff; }

#filter-support-english {
    align-self: flex-start;
    border: 1px solid var(--text-tertiary);
    color: var(--text-secondary);
}

#filter-support-english.active {
    background: var(--text);
    color: #fff;
    border-color: var(--text);
}
        #controls {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: flex-start;
}
        #filter-row {
    display: flex;
    flex-direction: row;
    gap: 10px;
}
#result-panel {
    position: fixed;
    top: 74px;
    right: 0;
    bottom: 0;
    width: 280px;
    z-index: 15;

    background: var(--paper);
    border-left: 1px solid var(--line);
    box-shadow: -4px 0 20px rgba(39, 33, 27, .08);

    display: flex;
    flex-direction: column;

    font-family: var(--sans);

    transform: translateX(0);           /* 기본: 화면 안에 위치 */
    transition: transform .25s ease;    /* 움직일 때 부드럽게 */
}

#result-panel.collapsed {
    transform: translateX(100%);        /* 자기 너비만큼 오른쪽으로 밀어서 화면 밖으로 */
}

#result-panel[hidden] { display: none; }

#result-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
}

#result-panel-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-secondary);
}

#result-panel-close {
    border: none;
    background: transparent;
    font-size: 18px;
    line-height: 1;
    color: var(--text-tertiary);
    cursor: pointer;
}

#result-panel-toggle {
    position: fixed;
    top: 50%;
    right: 280px;
    transform: translateY(-50%);
    z-index: 16;

    width: 24px;
    height: 56px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--paper);
    border: 1px solid var(--line);
    border-right: none;
    border-radius: 10px 0 0 10px;
    box-shadow: -3px 0 12px rgba(39, 33, 27, .1);

    font-size: 20px;
    font-weight: 900;
    color: var(--text-tertiary);
    cursor: pointer;

    transition: right .2s ease, background .15s ease, color .15s ease;
}

#result-panel-toggle:hover {
    background: var(--bg);
    color: var(--brown);
}

/* 패널이 접혀있을 때(hidden)는 화면 오른쪽 끝에 딱 붙는다 */
#result-panel-toggle.collapsed {
    right: 0;
}

#result-list {
    list-style: none;
    margin: 0;
    padding: 8px;
    overflow-y: auto;
}

#result-list li {
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s ease;
}

#result-list li:hover {
    background: var(--secondary);
}

#result-list .result-name {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text);
}

#result-list .result-address {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 2px;
}
    </style>
</head>
<body>

<div th:replace="~{fragments/common-includes :: commonIncludes}"></div>
<div id="map-wrapper">
    <div id="controls">
    <div id="temple-search-box">
<select id="search-type">
    <option value="name" data-i18n="searchTypeName">사찰 검색</option>
    <option value="address" data-i18n="searchTypeAddress">주소 검색</option>
</select>
<input type="text" id="search-keyword" data-i18n-placeholder="searchPlaceholder" placeholder="검색어를 입력하세요">
<button type="button" id="search-btn" data-i18n="searchBtn">검색</button>
</div>
        <div id="filter-row">
<div id="type-filter-box">
    <div class="panel-label" data-i18n="typeFilterLabel">유형으로 찾기</div>
    <div class="panel-section" id="temple-filter-box">
    <button type="button" id="data-type-sea" data-i18n="typeSea">바다</button>
    <button type="button" id="data-type-mountain" data-i18n="typeMountain">산</button>
    <button type="button" id="data-type-river" data-i18n="typeRiver">강</button>
    <button type="button" id="data-type-urban" data-i18n="typeUrban">도심</button>
</div>
    </div>
        <div id="language-filter-box">
        <div class="panel-label" data-i18n="languageFilterLabel">언어지원</div>
        <button type="button" id="filter-support-english" data-i18n="supportEnglish">영어 지원</button>
    </div>
            <div id="favorite-filter-box">
                <div class="panel-label" data-i18n="favoriteFilterLabel">즐겨찾기</div>
                <button type="button" id="filter-favorite">★</button>
            </div>
    </div>
    </div>
<div id="map"></div>
</div>
<button type="button" id="result-panel-toggle">></button>
<div id="result-panel" class="collapsed">
    <div id="result-panel-header">
        <span id="result-panel-title">사찰 목록</span>
        <button type="button" id="result-panel-close">x</button>
    </div>
    <ul id="result-list"></ul>
</div>
<!-- 공통 마커 함수(map-common.js) 먼저, 이 페이지 전용 로직(temple-list.js) 나중에 -->
<script src="/js/temple/findTemple.i18n.js"></script>
<script src="/js/mapCommon.js"></script>
<script src="/js/temple/templeList.js"></script>

</body>
</html>
