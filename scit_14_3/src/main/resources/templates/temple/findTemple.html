
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>사찰 찾아보기</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <!-- 카카오맵 SDK -->
    <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=4d97c12d7e3e28e5dd08a2f00a58025d&libraries=services"></script>
    <style>
        /* 헤더(.site-header)가 position:fixed, 높이 74px라서 그만큼 밀어줌 */
        body { margin: 0; padding-top: 74px; }
        #map-wrapper {
            position: relative;
            width: 100%;
            height: calc(100vh - 74px);
        }
        #map { width: 100%; height: 100%; }
     #temple-search-box {
    top: 12px;
    left: 12px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 8px;

    background: var(--paper);
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    box-shadow: 0 4px 20px rgba(39, 33, 27, .08);

    font-family: var(--sans);
    font-size: 13px;
}

#temple-search-box select,
#temple-search-box input[type="text"] {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--text);

    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 7px 10px;
}

#temple-search-box select:focus,
#temple-search-box input[type="text"]:focus {
    outline: none;
    border-color: var(--green);
}

#search-btn {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    color: #fff;

    background: var(--green);
    border: none;
    border-radius: 6px;
    padding: 7px 16px;

    cursor: pointer;
    transition: background .15s ease;
}

#search-btn:hover {
    background: #4a6350;
}

#type-filter-box,
#language-filter-box {
    background: var(--paper);
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    box-shadow: 0 4px 20px rgba(39, 33, 27, .08);

    font-family: var(--sans);
    font-size: 13px;

    display: flex;
    flex-direction: column;
    gap: 6px;
}

.panel-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .02em;
    color: var(--text-secondary);
}

#temple-filter-box {
    gap: 8px;
    flex-direction: row;
    align-items: center;
}

#temple-filter-box button,
#filter-support-english {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 700;

    background: #fff;
    border-radius: 999px;
    padding: 5px 12px;

    cursor: pointer;
    transition: background .15s ease, color .15s ease;
}

#data-type-sea { border: 1px solid var(--blue); color: var(--blue); }
#data-type-mountain { border: 1px solid var(--green); color: var(--green); }
#data-type-river { border: 1px solid var(--brown); color: var(--brown); }
#data-type-urban { border: 1px solid var(--gold); color: var(--gold); }

#data-type-sea.active { background: var(--blue); color: #fff; }
#data-type-mountain.active { background: var(--green); color: #fff; }
#data-type-river.active { background: var(--brown); color: #fff; }
#data-type-urban.active { background: var(--gold); color: #fff; }

#filter-support-english {
    align-self: flex-start;
    border: 1px solid var(--text-tertiary);
    color: var(--text-secondary);
}

#filter-support-english.active {
    background: var(--text);
    color: #fff;
    border-color: var(--text);
}
        #controls {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: flex-start;
}
        #filter-row {
    display: flex;
    flex-direction: row;
    gap: 10px;
}
    </style>
</head>
<body>

<div th:replace="~{fragments/common-includes :: commonIncludes}"></div>
<div id="map-wrapper">
    <div id="controls">
    <div id="temple-search-box">
<select id="search-type">
    <option value="name">사찰 검색</option>
    <option value="address">주소 검색</option>
</select>
<input type="text" id="search-keyword" placeholder="검색어를 입력하세요">
<button type="button" id="search-btn">검색</button>
</div>
        <div id="filter-row">
<div id="type-filter-box">
    <div class="panel-label">유형으로 찾기</div>
    <div class="panel-section" id="temple-filter-box">
    <button type="button" id="data-type-sea">바다</button>
    <button type="button" id="data-type-mountain">산</button>
    <button type="button" id="data-type-river">강</button>
    <button type="button" id="data-type-urban">도심</button>
</div>
    </div>
        <div id="language-filter-box">
        <div class="panel-label">언어지원</div>
        <button type="button" id="filter-support-english">영어 지원</button>
    </div>
</div>
    </div>
<div id="map"></div>
</div>
<!-- 공통 마커 함수(map-common.js) 먼저, 이 페이지 전용 로직(temple-list.js) 나중에 -->
<script src="/js/mapCommon.js"></script>
<script src="/js/temple/templeList.js"></script>

</body>
</html>
