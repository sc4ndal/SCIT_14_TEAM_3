
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>사찰 찾아보기</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <!-- 카카오맵 SDK -->
    <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=4d97c12d7e3e28e5dd08a2f00a58025d&libraries=services"></script>
    <link rel="stylesheet" th:href="@{/css/temple/findTemple.css}">
</head>
<body>

<div th:replace="~{fragments/common-includes :: commonIncludes}"></div>

<!-- 로그인 여부를 templeList.js가 확실하게 판단할 수 있는 서버 렌더 마커 - reservation.html과
     동일한 패턴. -->
<div id="auth-info" style="display:none;"
     sec:authorize="isAuthenticated()"
     th:attr="data-login-id=${#authentication.principal.username}, data-temple-account=${#authentication.principal.templeAccount}, data-is-admin=${#authentication.principal.admin}">
</div>

<div id="map-wrapper">
    <div id="controls">
    <div id="temple-search-box">
<select id="search-type" data-i18n-aria="searchTypeAria" aria-label="검색 종류">
    <option value="name" data-i18n="searchTypeName">사찰 검색</option>
    <option value="address" data-i18n="searchTypeAddress">주소 검색</option>
</select>
        <input type="text" id="search-keyword" data-i18n-placeholder="searchPlaceholder" data-i18n-aria="searchInputAria" aria-label="검색어 입력" placeholder="검색어를 입력하세요" autocomplete="off">
        <div id="search-history-dropdown" class="search-history-dropdown"></div>
        <button type="button" id="search-btn" aria-label="검색" data-i18n-aria="searchBtn">            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="10.5" cy="10.5" r="7"/>
                <line x1="16" y1="16" x2="21" y2="21"/>
            </svg>
        </button>
</div>
        <div id="filter-panel">
            <div class="filter-section">
                <span class="panel-label" data-i18n="typeFilterLabel">유형</span>
                <div class="panel-section" id="temple-filter-box">
                    <button type="button" id="data-type-sea" data-i18n="typeSea">바다</button>
                    <button type="button" id="data-type-mountain" data-i18n="typeMountain">산</button>
                    <button type="button" id="data-type-river" data-i18n="typeRiver">강</button>
                    <button type="button" id="data-type-urban" data-i18n="typeUrban">도심</button>
                </div>
            </div>
            <div class="filter-divider"></div>
            <div class="filter-section">
                <span class="panel-label" data-i18n="languageFilterLabel">언어</span>
                <button type="button" id="filter-support-english" data-i18n="supportEnglish">영어 지원</button>
            </div>
            <div class="filter-divider"></div>
            <div class="filter-section">
                <span class="panel-label" data-i18n="favoriteFilterLabel">즐겨찾기</span>
                <button type="button" id="filter-favorite">★</button>
            </div>
        </div>
    </div>
<div id="map"></div>
    <div id="map-controls-bottom">
            <button type="button" id="reset-map-btn" data-i18n="resetMapBtn">지도 전체보기</button>
    </div>
    <button type="button" id="near-me-btn" aria-label="내 주변 사찰" data-i18n-aria="nearMeAria">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <line x1="12" y1="2" x2="12" y2="5"/>
            <line x1="12" y1="19" x2="12" y2="22"/>
            <line x1="2" y1="12" x2="5" y2="12"/>
            <line x1="19" y1="12" x2="22" y2="12"/>
        </svg>
    </button>
</div>
<button type="button" id="result-panel-toggle">></button>
<div id="result-panel" class="collapsed">
    <div id="result-panel-header">
        <span id="result-panel-title" data-i18n="resultPanelTitle">사찰 목록</span>
        <button type="button" id="result-panel-close">x</button>
    </div>
    <ul id="result-list"></ul>
</div>

<!-- 공통 마커 함수(map-common.js) 먼저, 이 페이지 전용 로직(temple-list.js) 나중에 -->
<script th:src="@{/js/temple/templeI18n.js}"></script>
<script th:src="@{/js/temple/findTemple.i18n.js}"></script>
<script th:src="@{/js/mapCommon.js}"></script>
<script th:src="@{/js/temple/templeList.js}"></script>

</body>
</html>
