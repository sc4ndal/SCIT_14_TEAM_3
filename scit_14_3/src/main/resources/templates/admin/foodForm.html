<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>사찰음식 등록 · 사찰 커뮤니티</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/signup.css}">
	<link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>

<!-- formData: 신규 등록용 빈 Map, 검증 실패로 돌아온 경우엔 직전 입력값(이미지 파일 제외)
     등록만 제공하고 수정/삭제는 웹에서 제공하지 않음 -->

<div class="card">
	<div th:replace="~{fragments/common-includes :: commonIncludes}"></div>

	<div class="header">
		<h1>사찰음식 등록</h1>
		<p>사찰음식 정보를 입력해주세요</p>
		<p class="req-note"><span class="req">*</span> 표시는 필수 입력 항목입니다</p>
	</div>

	<p class="admin-alert admin-alert--err" th:if="${manageError}" th:text="${manageError}"></p>

	<form class="page-form" th:action="@{/admin/manage/food}" method="post" enctype="multipart/form-data">

		<fieldset>
			<legend>사찰음식 정보</legend>

			<div class="field">
				<label for="foodName">음식명<span class="req">*</span></label>
				<input type="text" id="foodName" name="foodName" maxlength="50" th:value="${formData['foodName']}" required>
			</div>

			<div class="field">
				<label for="imageFile">사진 <span class="optional-note">(선택)</span></label>
				<input type="file" id="imageFile" name="imageFile" accept="image/*">
				<p class="hint">최대 10MB까지 업로드 가능합니다</p>
				<!-- 실제 Cloudinary 업로드는 등록 버튼을 눌렀을 때 서버에서 처리함(templeForm.html과 같은 이유) -->
				<img id="imagePreview" alt="" style="display:none;max-width:220px;margin-top:8px;border-radius:4px;border:1px solid var(--border);">
			</div>

			<div class="field">
				<label for="description">소개 <span class="optional-note">(선택)</span></label>
				<textarea id="description" name="description" rows="3" th:text="${formData['description']}"></textarea>
			</div>

			<div class="field">
				<label for="recipe">레시피 <span class="optional-note">(선택)</span></label>
				<textarea id="recipe" name="recipe" rows="8" th:text="${formData['recipe']}"></textarea>
				<p class="hint">줄바꿈은 목록 화면에도 그대로 표시됩니다</p>
			</div>

			<div class="field">
				<label for="recipeUrl">레시피 참고 링크 <span class="optional-note">(선택)</span></label>
				<input type="url" id="recipeUrl" name="recipeUrl" maxlength="255" placeholder="https://" th:value="${formData['recipeUrl']}">
			</div>
		</fieldset>

		<div class="form-actions">
			<button class="submit" type="submit">등록</button>
			<a th:href="@{/admin/manage(tab='food')}" class="btn-cancel">취소</a>
		</div>
	</form>
</div>

<script>
	// 선택한 파일을 실제로 올리지 않고 브라우저 안에서만(FileReader) 미리보기
	const imageFileInput = document.getElementById('imageFile');
	const imagePreview = document.getElementById('imagePreview');

	imageFileInput.addEventListener('change', () => {
		const file = imageFileInput.files[0];
		if (!file) {
			imagePreview.style.display = 'none';
			return;
		}
		const reader = new FileReader();
		reader.onload = () => {
			imagePreview.src = reader.result;
			imagePreview.style.display = 'block';
		};
		reader.readAsDataURL(file);
	});
</script>

</body>
</html>
