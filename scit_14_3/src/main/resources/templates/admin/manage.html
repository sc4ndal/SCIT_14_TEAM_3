<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>관리 · 사찰 커뮤니티</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/card.css}">
	<link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>

<div class="card" style="max-width:1100px;">
	<div th:replace="~{fragments/common-includes :: commonIncludes}"></div>

	<div class="header" style="padding-bottom:16px;">
		<h1>관리</h1>
		<p>회원과 사찰 계정을 조회하고 정보를 수정하거나 삭제할 수 있습니다</p>
	</div>

	<nav class="admin-tabs">
		<a class="admin-tab" th:classappend="${tab == 'user'} ? ' active'" th:href="@{/admin/manage(tab='user')}">회원관리</a>
		<a class="admin-tab" th:classappend="${tab == 'temple'} ? ' active'" th:href="@{/admin/manage(tab='temple')}">사찰관리</a>
		<a class="admin-tab" th:classappend="${tab == 'event'} ? ' active'" th:href="@{/admin/manage(tab='event')}">행사관리</a>
		<a class="admin-tab" th:classappend="${tab == 'food'} ? ' active'" th:href="@{/admin/manage(tab='food')}">사찰음식관리</a>
		<a class="admin-tab" th:classappend="${tab == 'quote'} ? ' active'" th:href="@{/admin/manage(tab='quote')}">한마디관리</a>
	</nav>

	<p class="admin-alert admin-alert--ok" th:if="${manageSuccess}" th:text="${manageSuccess}"></p>
	<p class="admin-alert admin-alert--err" th:if="${manageError}" th:text="${manageError}"></p>

	<!-- ===================== 회원관리 ===================== -->
	<div th:if="${tab == 'user'}" class="admin-table-wrap" style="margin-top:16px;padding-bottom:32px;">
		<p th:if="${#lists.isEmpty(users)}" style="text-align:center; color:var(--ink-soft); padding:24px 0;">
			등록된 회원이 없습니다.
		</p>
		<table class="admin-table" th:if="${!#lists.isEmpty(users)}">
			<thead>
			<tr>
				<th>아이디</th>
				<th>법명</th>
				<th>이름</th>
				<th>연락처</th>
				<th>이메일</th>
				<th>권한</th>
				<th>가입방식</th>
				<th></th>
			</tr>
			</thead>
			<tbody>
			<tr th:each="u : ${users}">
				<td th:text="${u.loginId}"></td>
				<td class="no-translate" th:text="${u.nickname}"></td>
				<td class="no-translate" th:text="${u.name}"></td>
				<td th:text="${u.phone}"></td>
				<td th:text="${u.email}"></td>
				<td th:text="${u.role}"></td>
				<td th:text="${u.loginType}"></td>
				<td>
					<div class="row-actions">
						<a th:href="@{/admin/manage/user/{id}/edit(id=${u.loginId})}">수정</a>
						<form th:action="@{/admin/manage/user/{id}/delete(id=${u.loginId})}" method="post" style="margin:0;"
						      onsubmit="return confirm(i18nMsg('confirmDelete'));">
							<button type="submit" class="danger">삭제</button>
						</form>
					</div>
				</td>
			</tr>
			</tbody>
		</table>
	</div>

	<!-- ===================== 사찰관리 ===================== -->
	<div th:if="${tab == 'temple'}" class="admin-table-wrap" style="margin-top:16px;padding-bottom:32px;">
		<!-- 평점/리뷰건수는 보통 리뷰 작성·수정·삭제 때마다 자동 갱신되는데, 그 경로를 거치지
		     않고 들어간 기존 리뷰(시드데이터 등)는 반영이 안 돼있을 수 있어 수동 재계산 버튼을 둔다. -->
		<form th:action="@{/admin/manage/temple/recalculate-ratings}" method="post" style="margin-bottom:12px;">
			<button type="submit" class="btn-check">전체 사찰 평점 재계산</button>
		</form>
		<p th:if="${#lists.isEmpty(temples)}" style="text-align:center; color:var(--ink-soft); padding:24px 0;">
			등록된 사찰이 없습니다.
		</p>
		<table class="admin-table" th:if="${!#lists.isEmpty(temples)}">
			<thead>
			<tr>
				<th>사찰명</th>
				<th>아이디</th>
				<th>주소</th>
				<th>지역</th>
				<th>장소 유형</th>
				<th></th>
			</tr>
			</thead>
			<tbody>
			<tr th:each="t : ${temples}">
				<td th:text="${t.name}"></td>
				<td th:text="${t.loginId}"></td>
				<td class="wrap" th:text="${t.address}"></td>
				<td th:text="${t.region}"></td>
				<td>
					<div class="type-pill-group">
						<span class="type-pill sea" th:if="${t.supportSea}">바다</span>
						<span class="type-pill mountain" th:if="${t.supportMountain}">산</span>
						<span class="type-pill river" th:if="${t.supportRiver}">강</span>
						<span class="type-pill urban" th:if="${t.supportUrban}">도심</span>
					</div>
				</td>
				<td>
					<div class="row-actions">
						<a th:href="@{/admin/manage/temple/{id}/edit(id=${t.templeId})}">수정</a>
						<form th:action="@{/admin/manage/temple/{id}/delete(id=${t.templeId})}" method="post" style="margin:0;"
						      onsubmit="return confirm(i18nMsg('confirmCancelRegistration'));">
							<button type="submit" class="danger">등록취소</button>
						</form>
					</div>
				</td>
			</tr>
			</tbody>
		</table>
	</div>

	<!-- ===================== 행사관리 (등록만 - 수정/삭제는 웹에서 제공하지 않음) ===================== -->
	<div th:if="${tab == 'event'}" class="admin-table-wrap" style="margin-top:16px;padding-bottom:32px;">
		<div style="display:flex;justify-content:flex-end;margin-bottom:12px;">
			<a class="submit" th:href="@{/admin/manage/event/new}"
			   style="display:inline-block;width:auto;padding:10px 20px;text-decoration:none;">행사 등록</a>
		</div>
		<p th:if="${#lists.isEmpty(events)}" style="text-align:center; color:var(--ink-soft); padding:24px 0;">
			등록된 행사가 없습니다.
		</p>
		<table class="admin-table" th:if="${!#lists.isEmpty(events)}">
			<thead>
			<tr>
				<th>행사명</th>
				<th>사찰</th>
				<th>기간</th>
				<th>링크</th>
			</tr>
			</thead>
			<tbody>
			<tr th:each="e : ${events}" th:style="${e.past} ? 'color:var(--ink-soft);'">
				<td class="wrap" th:text="${e.title}"></td>
				<td th:text="${e.templeName}"></td>
				<td th:text="${#temporals.format(e.startDate, 'yyyy-MM-dd') + ' ~ ' + #temporals.format(e.endDate, 'yyyy-MM-dd')}"></td>
				<td>
					<a th:if="${e.linkUrl != null}" th:href="${e.linkUrl}" target="_blank" rel="noopener">열기</a>
				</td>
			</tr>
			</tbody>
		</table>
	</div>

	<!-- ===================== 사찰음식관리 (등록만 - 수정/삭제는 웹에서 제공하지 않음) ===================== -->
	<div th:if="${tab == 'food'}" class="admin-table-wrap" style="margin-top:16px;padding-bottom:32px;">
		<div style="display:flex;justify-content:flex-end;margin-bottom:12px;">
			<a class="submit" th:href="@{/admin/manage/food/new}"
			   style="display:inline-block;width:auto;padding:10px 20px;text-decoration:none;">사찰음식 등록</a>
		</div>
		<p th:if="${#lists.isEmpty(foods)}" style="text-align:center; color:var(--ink-soft); padding:24px 0;">
			등록된 사찰음식이 없습니다.
		</p>
		<table class="admin-table" th:if="${!#lists.isEmpty(foods)}">
			<thead>
			<tr>
				<th>사진</th>
				<th>음식명</th>
				<th>소개</th>
				<th>레시피 링크</th>
			</tr>
			</thead>
			<tbody>
			<tr th:each="f : ${foods}">
				<td>
					<img th:if="${f.imageUrl() != null}" th:src="${f.imageUrl()}" th:alt="${f.foodName()}"
					     style="width:56px;height:56px;object-fit:cover;border-radius:4px;display:block;">
				</td>
				<td th:text="${f.foodName()}"></td>
				<td class="wrap" th:text="${f.description() != null and #strings.length(f.description()) > 60} ? ${#strings.substring(f.description(), 0, 60) + '…'} : ${f.description()}"></td>
				<td>
					<a th:if="${f.recipeUrl() != null}" th:href="${f.recipeUrl()}" target="_blank" rel="noopener">열기</a>
				</td>
			</tr>
			</tbody>
		</table>
	</div>

	<!-- ===================== 한마디관리 (등록만 - 수정/삭제는 웹에서 제공하지 않음) ===================== -->
	<div th:if="${tab == 'quote'}" class="admin-table-wrap" style="margin-top:16px;padding-bottom:32px;">
		<div style="display:flex;justify-content:flex-end;margin-bottom:12px;">
			<a class="submit" th:href="@{/admin/manage/quote/new}"
			   style="display:inline-block;width:auto;padding:10px 20px;text-decoration:none;">한마디 등록</a>
		</div>
		<p th:if="${#lists.isEmpty(quotes)}" style="text-align:center; color:var(--ink-soft); padding:24px 0;">
			등록된 한마디가 없습니다.
		</p>
		<table class="admin-table" th:if="${!#lists.isEmpty(quotes)}">
			<thead>
			<tr>
				<th>번호</th>
				<th>내용</th>
				<th>출처</th>
			</tr>
			</thead>
			<tbody>
			<tr th:each="q : ${quotes}">
				<td th:text="${q.quoteId()}"></td>
				<td class="wrap" th:text="${q.content()}"></td>
				<td th:text="${q.source()}"></td>
			</tr>
			</tbody>
		</table>
	</div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
