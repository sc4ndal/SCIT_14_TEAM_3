<!DOCTYPE html>
<html lang="ko" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>사찰 등록 요청 목록 · 사찰 커뮤니티</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/signup.css}">
	<link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>

<div class="card" style="max-width:900px;">
	<div th:replace="~{fragments/common-includes :: commonIncludes}"></div>

	<div class="header">
		<h1>사찰 등록 요청 목록</h1>
		<p>검토가 필요한 대기중인 문의만 표시됩니다. 승인된 사찰은 관리 &gt; 사찰관리에서 확인할 수 있습니다</p>
	</div>

	<p class="check-result" style="color:#2f6b5e; text-align:center;" th:if="${createSuccess}">
		사찰이 등록되고 계정 정보가 이메일로 발송되었습니다.
	</p>

	<div class="admin-table-wrap" style="margin-top:8px;padding-bottom:32px;">
		<p th:if="${#lists.isEmpty(requests)}" style="text-align:center; color:var(--ink-soft); padding:24px 0;">
			대기중인 요청이 없습니다.
		</p>
		<table class="admin-table" th:if="${!#lists.isEmpty(requests)}">
			<thead>
			<tr>
				<th>사찰명</th>
				<th>지역</th>
				<th>연락 이메일</th>
				<th>장소 유형</th>
				<th>상태</th>
				<th></th>
			</tr>
			</thead>
			<tbody>
			<tr th:each="r : ${requests}">
				<td th:text="${r.name}"></td>
				<td th:text="${r.region}"></td>
				<td th:text="${r.contactEmail}"></td>
				<td>
					<div class="type-pill-group">
						<span class="type-pill sea" th:if="${r.supportSea}">바다</span>
						<span class="type-pill mountain" th:if="${r.supportMountain}">산</span>
						<span class="type-pill river" th:if="${r.supportRiver}">강</span>
						<span class="type-pill urban" th:if="${r.supportUrban}">도심</span>
					</div>
				</td>
				<td><span class="badge badge-pending" th:text="${r.status}"></span></td>
				<td>
					<div class="row-actions">
						<a th:href="@{/admin/temple-requests/{id}(id=${r.requestId})}">상세보기</a>
					</div>
				</td>
			</tr>
			</tbody>
		</table>
	</div>
</div>

</body>
</html>
