<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>회원 정보 수정 · 사찰 커뮤니티</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/signup.css}">
	<link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>

<div class="card">
	<div th:replace="~{fragments/common-includes :: commonIncludes}"></div>

	<div class="header">
		<h1>회원 정보 수정</h1>
		<p th:text="'아이디: ' + ${target.loginId}"></p>
	</div>

	<p class="check-result" style="color:var(--destructive); text-align:center;" th:if="${manageError}" th:text="${manageError}"></p>

	<form class="page-form" th:action="@{/admin/manage/user/{id}(id=${target.loginId})}" method="post">
		<fieldset>
			<legend>회원 정보</legend>

			<div class="field">
				<label>아이디</label>
				<input type="text" th:value="${target.loginId}" disabled>
				<p class="hint">아이디는 수정할 수 없습니다</p>
			</div>

			<div class="field">
				<label for="nickname">법명<span class="req">*</span></label>
				<input type="text" id="nickname" name="nickname" maxlength="30" th:value="${target.nickname}" required>
			</div>

			<div class="field">
				<label for="name">이름<span class="req">*</span></label>
				<input type="text" id="name" name="name" maxlength="150" th:value="${target.name}" required>
			</div>

			<div class="field">
				<label for="phone">연락처 <span class="optional-note">(선택)</span></label>
				<input type="text" id="phone" name="phone" maxlength="20" th:value="${target.phone}">
			</div>

			<div class="field">
				<label for="email">이메일<span class="req">*</span></label>
				<input type="email" id="email" name="email" maxlength="100" th:value="${target.email}" required>
			</div>

			<div class="field">
				<label for="role">권한<span class="req">*</span></label>
				<select id="role" name="role" required>
					<option value="USER" th:selected="${target.role.name() == 'USER'}">일반회원 (USER)</option>
					<option value="ADMIN" th:selected="${target.role.name() == 'ADMIN'}">사이트 관리자 (ADMIN)</option>
				</select>
			</div>
		</fieldset>

		<div class="form-actions">
			<button class="submit" type="submit">저장</button>
			<a th:href="@{/admin/manage(tab='user')}" class="btn-cancel">취소</a>
		</div>
	</form>
</div>

</body>
</html>
