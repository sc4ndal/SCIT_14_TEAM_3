<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>사찰 정보 수정 · 사찰 커뮤니티</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/signup.css}">
	<link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>

<!-- formData: TempleDTO(수정 대상 사찰) - 신규 등록은 사찰 등록 요청 승인 시 서버가 바로 처리하므로 이 폼을 안 거침 -->

<div class="card">
	<div th:replace="~{fragments/common-includes :: commonIncludes}"></div>

	<div class="header">
		<h1>사찰 정보 수정</h1>
		<p>사찰 정보를 확인하고 필요한 부분을 수정해주세요</p>
		<p class="req-note"><span class="req">*</span> 표시는 필수 입력 항목입니다</p>
	</div>

	<!-- 로그인ID/비밀번호는 여기서 안 건드림 -->
	<form class="page-form" th:action="@{/admin/manage/temple/{id}(id=${formData.templeId})}"
	      method="post" enctype="multipart/form-data">

		<fieldset>
			<legend>사찰 정보</legend>

			<div class="field">
				<label for="name">사찰 이름<span class="req">*</span></label>
				<input type="text" id="name" name="name" maxlength="100" th:value="${formData.name}" required>
			</div>

			<div class="field">
				<label for="imageFile">대표 이미지 <span class="optional-note">(선택)</span></label>
				<input type="file" id="imageFile" name="imageFile" accept="image/*">
				<p class="hint">최대 10MB까지 업로드 가능합니다</p>
				<!-- 실제 Cloudinary 업로드는 이 폼을 제출할 때(저장 버튼) 서버에서 한 번에 처리함 -
				     선택 즉시 올려버리면 취소해도 이미지만 Cloudinary에 남는 문제가 생김.
				     기존 URL은 새 파일을 안 고르면 그대로 유지됨. -->
				<input type="hidden" name="imageUrl" th:value="${formData.imageUrl}">
				<div th:if="${formData.imageUrl != null and !#strings.isEmpty(formData.imageUrl)}" style="margin-top:8px;">
					<img id="imagePreview" alt="" th:src="${formData.imageUrl}"
					     style="display:block;max-width:220px;border-radius:4px;border:1px solid var(--border);">
					<p class="hint" style="word-break:break-all;" th:text="${formData.imageUrl}"></p>
				</div>
				<img id="imagePreview" alt="" style="display:none;max-width:220px;margin-top:8px;border-radius:4px;border:1px solid var(--border);"
				     th:if="${formData.imageUrl == null or #strings.isEmpty(formData.imageUrl)}">
			</div>

			<div class="field">
				<label for="address">주소<span class="req">*</span></label>
				<input type="text" id="address" name="address" maxlength="255" th:value="${formData.address}" required>
			</div>

			<div class="field field-inline">
				<div style="flex:1;">
					<label for="latitude">위도<span class="req">*</span></label>
					<input type="text" id="latitude" name="latitude" th:value="${formData.latitude}" required>
				</div>
				<div style="flex:1;">
					<label for="longitude">경도<span class="req">*</span></label>
					<input type="text" id="longitude" name="longitude" th:value="${formData.longitude}" required>
				</div>
			</div>

			<div class="field">
				<label for="region">지역(시/도)<span class="req">*</span></label>
				<input type="text" id="region" name="region" maxlength="20" th:value="${formData.region}" required>
			</div>

			<div class="field">
				<label>장소 유형<span class="req">*</span> <span class="optional-note">(중복 선택 가능)</span></label>
				<div class="radio-group" id="locationTypeGroup">
					<label><input type="checkbox" name="supportSea" value="true" th:checked="${formData.supportSea}"> 바다</label>
					<label><input type="checkbox" name="supportMountain" value="true" th:checked="${formData.supportMountain}"> 산</label>
					<label><input type="checkbox" name="supportRiver" value="true" th:checked="${formData.supportRiver}"> 강</label>
					<label><input type="checkbox" name="supportUrban" value="true" th:checked="${formData.supportUrban}"> 도심</label>
				</div>
				<p class="hint" id="locationTypeHint" style="display:none;color:var(--destructive);">최소 하나는 선택해주세요</p>
			</div>

			<div class="field">
				<label class="terms-checkbox" style="margin-bottom:0;">
					<input type="checkbox" id="supportEnglish" name="supportEnglish" value="true" th:checked="${formData.supportEnglish}">
					<span>영어 안내 지원 가능</span>
				</label>
			</div>

			<div class="field">
				<label for="specialNotice">참고사항 <span class="optional-note">(선택)</span></label>
				<textarea id="specialNotice" name="specialNotice" rows="4"
				          style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:4px;font-family:inherit;font-size:14px;"
				          th:text="${formData.specialNotice}"></textarea>
			</div>
		</fieldset>

		<div class="form-actions">
			<button class="submit" type="submit">저장</button>
			<a th:href="@{/admin/manage(tab='temple')}" class="btn-cancel">취소</a>
		</div>
	</form>
</div>

<script>
	// Cloudinary 업로드는 서버(저장 요청)에서 처리함 - 여기선 선택한 파일을
	// 실제로 올리지 않고 브라우저 안에서만(FileReader) 미리보기를 띄움.
	const imageFileInput = document.getElementById('imageFile');
	const imagePreview = document.getElementById('imagePreview');

	imageFileInput.addEventListener('change', () => {
		const file = imageFileInput.files[0];
		if (!file) return;

		const reader = new FileReader();
		reader.onload = () => {
			imagePreview.src = reader.result;
			imagePreview.style.display = 'block';
		};
		reader.readAsDataURL(file);
	});

	// 장소 유형 체크박스 최소 1개 검증
	document.querySelector('form[action^="/admin/manage/temple/"]').addEventListener('submit', (e) => {
		const checked = document.querySelectorAll('#locationTypeGroup input:checked');
		document.getElementById('locationTypeHint').style.display = checked.length === 0 ? 'block' : 'none';
		if (checked.length === 0) e.preventDefault();
	});
</script>

</body>
</html>
