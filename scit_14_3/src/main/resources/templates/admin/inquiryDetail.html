<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>문의 상세 · 사찰 커뮤니티</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/signup.css}">
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<style>
		.inquiry-detail-wrap { width:100%; max-width:920px; }

		.back-btn {
			display: inline-block;
			margin-bottom: 16px;
			padding: 11px 20px;
			background: var(--surface);
			border: 1px solid var(--border);
			border-radius: 999px;
			color: var(--ink);
			font-family: inherit;
			font-size: 14px;
			font-weight: 600;
		}
		.back-btn:hover { background: var(--cream); }

		.header-row {
			display: flex;
			align-items: flex-start;
			justify-content: space-between;
			gap: 16px;
			padding: 32px 32px 8px;
		}
		.header-row h1 {
			margin: 0;
			font-family: var(--sans);
			font-weight: 700;
			font-size: 22px;
			letter-spacing: -0.01em;
		}
		.status-badge-lg {
			flex-shrink: 0;
			color: #fff;
			font-size: 13px;
			font-weight: 700;
			padding: 5px 14px;
			border-radius: 999px;
		}

		.inquiry-content-box,
		.answer-box {
			/* .card 배경(--surface)과 같은 색을 쓰면 박스가 안 보여서(카드 배경에 파묻힘)
			   문의내용/답변 중 하나만 튀어보이는 문제가 있었음 - 둘 다 카드 배경과
			   구분되는 색을 명시적으로 줌. */
			background: var(--muted-bg);
			border: 1px solid var(--line);
			border-radius: 8px;
			padding: 18px 20px;
			white-space: pre-wrap;
			word-break: break-word;
			line-height: 1.8;
			font-size: 14px;
		}
		.answer-box {
			background: rgba(92, 122, 98, .09);
			border-color: rgba(92, 122, 98, .25);
		}

		/* mypage/inquiryWrite.html의 .inquiry-textarea와 동일한 값으로 맞춤 */
		.answer-form textarea {
			width: 100%;
			min-height: 300px;
			border: 1px solid var(--line);
			border-radius: 6px;
			padding: 16px;
			font-family: inherit;
			font-size: 15px;
			line-height: 1.6;
			color: var(--ink);
			resize: vertical;
		}
		.answer-form textarea:focus { outline: none; border-color: var(--wood); }
	</style>
</head>
<body>

<div th:replace="~{fragments/common-includes :: commonIncludes}"></div>

<div class="inquiry-detail-wrap">
	<a th:href="@{/admin/inquiries}" class="back-btn">← 목록으로</a>

	<div class="card">
		<div class="header-row">
			<h1>문의 상세</h1>
			<span class="status-badge-lg"
			      th:classappend="${inquiry.status.name() == '답변완료'} ? ' badge-approved' : ' badge-pending'"
			      th:text="${inquiry.status}">대기</span>
		</div>

		<p class="admin-alert admin-alert--ok" th:if="${answerSuccess}">
			답변이 등록되었습니다.
		</p>

		<div class="admin-table-wrap" style="padding:8px 32px 0;">
			<table class="detail-table">
				<tbody>
				<tr><th>작성자</th><td th:text="${inquiry.nickname} + ' (' + ${inquiry.loginId} + ')'"></td></tr>
				<tr><th>작성일</th><td th:text="${#temporals.format(inquiry.createdAt, 'yyyy.MM.dd HH:mm')}"></td></tr>
				<tr><th>제목</th><td th:text="${inquiry.title}"></td></tr>
				<tr>
					<th>문의 내용</th>
					<td class="inquiry-content-box" th:text="${inquiry.content}"></td>
				</tr>
				<tr th:if="${inquiry.status.name() == '답변완료'}">
					<th>답변</th>
					<td>
						<div class="answer-box" th:text="${inquiry.answer}"></div>
						<p class="hint" style="margin-top:6px;" th:text="'답변일: ' + ${#temporals.format(inquiry.answeredAt, 'yyyy.MM.dd HH:mm')}"></p>
					</td>
				</tr>
				</tbody>
			</table>
		</div>

		<div style="padding:20px 32px 32px;">
			<form class="answer-form" th:if="${inquiry.status.name() != '답변완료'}"
			      th:action="@{/admin/inquiries/{id}/answer(id=${inquiry.inquiryId})}" method="post">
				<label for="answer-text" style="display:block;font-weight:700;font-size:13.5px;margin-bottom:10px;">답변 작성</label>
				<textarea id="answer-text" name="answer" placeholder="문의하신 내용에 대한 답변을 작성해주세요." required></textarea>
				<div class="form-actions" style="padding-top:16px;justify-content:flex-end;">
					<button type="submit" class="submit" style="width:130px;">답변 등록</button>
				</div>
			</form>
		</div>
	</div>
</div>

</body>
</html>
