<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>사찰 등록 요청 상세 · 사찰 커뮤니티</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/signup.css}">
	<link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>

<div class="card" style="max-width:760px;">
	<div th:replace="~{fragments/common-includes :: commonIncludes}"></div>

	<div class="header">
		<h1 th:text="${request.name}">사찰명</h1>
		<span class="badge"
		      th:classappend="${request.status.name() == '승인'} ? ' badge-approved' : ' badge-pending'"
		      th:text="${request.status}">대기</span>
	</div>

	<div class="admin-table-wrap" style="padding:8px 32px 0;">
		<table class="detail-table">
			<tbody>
			<tr th:if="${request.imageUrl != null and !#strings.isEmpty(request.imageUrl)}">
				<th>대표 이미지</th>
				<td>
					<img th:src="${request.imageUrl}" alt="" style="display:block;max-width:320px;max-height:320px;border-radius:6px;border:1px solid var(--border);object-fit:cover;">
					<p class="hint" style="word-break:break-all;margin-top:6px;" th:text="${request.imageUrl}"></p>
				</td>
			</tr>
			<tr><th>주소</th><td th:text="${request.address}"></td></tr>
			<tr><th>위도 / 경도</th><td th:text="${request.latitude} + ' / ' + ${request.longitude}"></td></tr>
			<tr><th>지역</th><td th:text="${request.region}"></td></tr>
			<tr>
				<th>장소 유형</th>
				<td>
					<div class="type-pill-group">
						<span class="type-pill sea" th:if="${request.supportSea}">바다</span>
						<span class="type-pill mountain" th:if="${request.supportMountain}">산</span>
						<span class="type-pill river" th:if="${request.supportRiver}">강</span>
						<span class="type-pill urban" th:if="${request.supportUrban}">도심</span>
						<span th:if="${!request.supportSea and !request.supportMountain and !request.supportRiver and !request.supportUrban}"
						      style="color:var(--text-secondary);font-size:13px;">없음</span>
					</div>
				</td>
			</tr>
			<tr><th>영어 안내</th><td th:text="${request.supportEnglish} ? '가능' : '불가'"></td></tr>
			<tr th:if="${request.specialNotice != null and !#strings.isEmpty(request.specialNotice)}">
				<th>유의사항</th><td th:text="${request.specialNotice}"></td>
			</tr>
			<tr th:if="${request.refundPolicy != null and !#strings.isEmpty(request.refundPolicy)}">
				<th>환불 규정</th><td th:text="${request.refundPolicy}"></td>
			</tr>
			<tr><th>연락 이메일</th><td th:text="${request.contactEmail}"></td></tr>
			</tbody>
		</table>
	</div>

	<div class="form-actions" style="padding:20px 32px 32px;justify-content:flex-end;">
		<p th:if="${request.status.name() != '대기'}" style="margin:0 auto 0 0;color:var(--ink-soft);">
			이미 처리된 요청입니다.
		</p>
		<a th:href="@{/admin/temple-requests}" class="btn-cancel" style="flex:none;width:110px;">목록으로</a>
		<form th:if="${request.status.name() == '대기'}" th:action="@{/admin/temple-requests/{id}/approve(id=${request.requestId})}"
		      method="post" style="margin:0;" onsubmit="return confirm('이 요청을 승인하고 사찰 계정을 생성하시겠습니까? 계정 정보가 즉시 이메일로 발송됩니다.');">
			<button type="submit" class="submit" style="width:110px;">등록</button>
		</form>
	</div>
</div>

</body>
</html>
