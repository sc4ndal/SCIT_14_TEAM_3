<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>문의 목록 · 사찰 커뮤니티</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<link rel="stylesheet" th:href="@{/css/inquiry/inquiryDetail.css}">
	<script th:src="@{/js/inquiry/inquiryI18n.js}" defer></script>
</head>
<body style="margin:0;padding:122px 16px 80px;">

<div th:replace="~{fragments/common-includes :: commonIncludes}"></div>

<div class="inquiry-detail-wrap">
	<div class="inquiry-page-header">
		<div>
			<h1 class="inquiry-page-title no-translate" data-pi18n="adminListTitle">문의 목록</h1>
			<p class="inquiry-page-subtitle no-translate" data-pi18n="adminListSubtitle">일반회원이 남긴 1:1 문의입니다. 답변 대기중인 문의가 먼저 표시됩니다.</p>
		</div>
	</div>

	<p class="inquiry-empty no-translate" data-pi18n="manageListEmpty" th:if="${#lists.isEmpty(inquiries)}">
		접수된 문의가 없습니다.
	</p>

	<div class="inquiry-list" th:if="${!#lists.isEmpty(inquiries)}">
		<a class="inquiry-row" th:each="q : ${inquiries}"
		   th:href="@{/admin/inquiries/{id}(id=${q.inquiryId})}">
			<div class="info">
				<h3 th:text="${q.title}"></h3>
				<p><strong class="no-translate" th:text="${q.nickname}"></strong>&nbsp;·&nbsp;<span th:text="${#temporals.format(q.createdAt, 'yyyy.MM.dd HH:mm')}"></span></p>
			</div>
			<span class="inquiry-status no-translate" th:classappend="'status-' + ${q.status}"
			      th:attr="data-pi18n-status=${q.status}" data-pi18n="statusPlaceholder" th:text="${q.status}"></span>
		</a>
	</div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
