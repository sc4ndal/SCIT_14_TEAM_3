<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>문의 목록 · 사찰 커뮤니티</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/signup.css}">
	<link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>

<div class="card" style="max-width:900px;">
	<div th:replace="~{fragments/common-includes :: commonIncludes}"></div>

	<div class="header">
		<h1>문의 목록</h1>
		<p>일반회원이 남긴 1:1 문의입니다. 답변 대기중인 문의가 먼저 표시됩니다</p>
	</div>

	<div class="admin-table-wrap" style="margin-top:8px;padding-bottom:32px;">
		<p th:if="${#lists.isEmpty(inquiries)}" style="text-align:center; color:var(--ink-soft); padding:24px 0;">
			접수된 문의가 없습니다.
		</p>
		<table class="admin-table" th:if="${!#lists.isEmpty(inquiries)}">
			<thead>
			<tr>
				<th>제목</th>
				<th>작성자</th>
				<th>작성일</th>
				<th>상태</th>
				<th></th>
			</tr>
			</thead>
			<tbody>
			<tr th:each="q : ${inquiries}">
				<td th:text="${q.title}"></td>
				<td th:text="${q.nickname}"></td>
				<td th:text="${#temporals.format(q.createdAt, 'yyyy.MM.dd HH:mm')}"></td>
				<td>
					<span class="badge" th:classappend="${q.status.name() == '답변완료'} ? ' badge-approved' : ' badge-pending'"
					      th:text="${q.status}"></span>
				</td>
				<td>
					<div class="row-actions">
						<a th:href="@{/admin/inquiries/{id}(id=${q.inquiryId})}">상세보기</a>
					</div>
				</td>
			</tr>
			</tbody>
		</table>
	</div>
</div>

</body>
</html>
