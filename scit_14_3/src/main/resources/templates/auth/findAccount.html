<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>아이디 · 비밀번호 찾기 · 사찰 커뮤니티</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/signup.css}">
    <script src="/js/auth/findAccount.js" defer></script>
    <style>
        .account-tabs{display:flex;margin:0 32px;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
        .account-tab{flex:1;background:none;border:none;font-family:inherit;font-size:14px;font-weight:700;
            color:var(--ink-soft);cursor:pointer;padding:12px 0;}
        .account-tab + .account-tab{border-left:1px solid var(--border);}
        .account-tab.active{color:#fff;background:var(--wood-dark);}
        .tab-desc{text-align:center;font-size:13px;color:var(--ink-soft);margin:14px 32px 0;}
        .small-nav-links{display:flex;justify-content:space-between;padding:0 32px 28px;font-size:12px;}
        .small-nav-links a{color:var(--ink-soft);text-decoration:none;}
        .small-nav-links a:hover{color:var(--wood-dark);}
    </style>
</head>
<body th:attr="data-active-tab=${activeTab}">

<div class="card">
    <div th:replace="~{fragments/common-includes :: commonIncludes}"></div>

    <div class="header">
        <h1>계정 찾기</h1>
    </div>

    <div class="account-tabs">
        <button type="button" class="account-tab" id="tabBtnId" onclick="switchAccountTab('id')">아이디 찾기</button>
        <button type="button" class="account-tab" id="tabBtnPw" onclick="switchAccountTab('pw')">비밀번호 찾기</button>
    </div>

    <p class="tab-desc" id="tabDescId">가입 시 등록한 이메일을 입력해주세요</p>
    <p class="tab-desc" id="tabDescPw">가입 시 등록한 이메일을 입력해주세요. 비밀번호 재설정 링크를 보내드립니다</p>

    <!-- ===== 아이디 찾기 =====
         페이지 이동 없이 fetch로 전부 처리함:
         이메일이 DB에 등록돼있는지 확인 -> 없으면 alert -> 있으면 그 이메일로 아이디 원문을 바로 발송.
         (인증번호 절차 없음 - 메일함에 접근 가능한 사람만 결과를 받아보니 그 자체가 본인 확인 역할) -->
    <div class="page-form" id="findIdForm">

        <div class="field">
            <label for="emailLocal">이메일</label>
            <div class="email-row">
                <input type="text" id="emailLocal" class="email-local" placeholder="이메일 아이디" oninput="updateFullEmail(''); resetFindIdFlow();">
                <span class="at-sign">@</span>
                <select id="emailDomainSelect" onchange="handleDomainChange(''); resetFindIdFlow();">
                    <option value="naver.com">naver.com</option>
                    <option value="gmail.com">gmail.com</option>
                    <option value="daum.net">daum.net</option>
                    <option value="kakao.com">kakao.com</option>
                    <option value="nate.com">nate.com</option>
                    <option value="hanmail.net">hanmail.net</option>
                    <option value="outlook.com">outlook.com</option>
                    <option value="icloud.com">icloud.com</option>
                    <option value="custom">직접입력</option>
                </select>
                <input type="text" id="emailDomainCustom" class="domain-custom" style="display:none" placeholder="도메인 입력" oninput="updateFullEmail(''); resetFindIdFlow();">
            </div>
            <span class="check-result" id="findIdEmailResult"></span>

            <input type="hidden" id="email" name="email" value="">
        </div>

        <div class="form-actions">
            <button class="submit" type="button" id="findIdSubmitBtn" onclick="findMyIdByEmail()">확인</button>
        </div>

        <div class="small-nav-links">
            <a th:href="@{/login}">로그인하기</a>
            <a th:href="@{/}">홈으로</a>
        </div>
    </div>

    <!-- ===== 비밀번호 찾기 =====
         이메일만 확인함(아이디 요구 안 함). 페이지 이동 없이 fetch로 전부 처리:
         이메일이 DB에 등록돼있는지 확인 -> 없으면 alert -> 있으면 그 이메일로 재설정 링크(5분 유효 토큰) 발송. -->
    <div class="page-form" id="findPwForm" style="display:none">

        <div class="field">
            <label for="emailLocalPw">이메일</label>
            <div class="email-row">
                <input type="text" id="emailLocalPw" class="email-local" placeholder="이메일 아이디" oninput="updateFullEmail('Pw'); resetFindPwFlow();">
                <span class="at-sign">@</span>
                <select id="emailDomainSelectPw" onchange="handleDomainChange('Pw'); resetFindPwFlow();">
                    <option value="naver.com">naver.com</option>
                    <option value="gmail.com">gmail.com</option>
                    <option value="daum.net">daum.net</option>
                    <option value="kakao.com">kakao.com</option>
                    <option value="nate.com">nate.com</option>
                    <option value="hanmail.net">hanmail.net</option>
                    <option value="outlook.com">outlook.com</option>
                    <option value="icloud.com">icloud.com</option>
                    <option value="custom">직접입력</option>
                </select>
                <input type="text" id="emailDomainCustomPw" class="domain-custom" style="display:none" placeholder="도메인 입력" oninput="updateFullEmail('Pw'); resetFindPwFlow();">
            </div>
            <span class="check-result" id="findPwResult"></span>

            <input type="hidden" id="emailPw" name="email" value="">
        </div>

        <div class="form-actions">
            <button class="submit" type="button" id="findPwSubmitBtn" onclick="findMyPwByEmail()">확인</button>
        </div>

        <div class="small-nav-links">
            <a th:href="@{/login}">로그인하기</a>
            <a th:href="@{/}">홈으로</a>
        </div>
    </div>

</div>

</body>
</html>
