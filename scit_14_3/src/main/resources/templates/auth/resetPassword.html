<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>비밀번호 재설정 · 사찰 커뮤니티</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/signup.css}">
    <script src="/js/auth/resetPassword.js" defer></script>
</head>
<body>

<div class="card">
    <div th:replace="~{fragments/common-includes :: commonIncludes}"></div>

    <div class="header">
        <h1>비밀번호 재설정</h1>
    </div>

    <!-- ===== 링크 만료/무효 ===== -->
    <div th:if="${!tokenValid}" style="padding:24px 32px 32px; text-align:center;">
        <p class="check-result fail">링크가 만료되었거나 유효하지 않습니다. 다시 시도해주세요.</p>
        <a class="btn-cancel" th:href="@{/findAccount(tab='pw')}">비밀번호 찾기로 돌아가기</a>
    </div>

    <!-- ===== 새 비밀번호 입력 ===== -->
    <form class="page-form" th:if="${tokenValid}" th:action="@{/resetPassword}" method="post">

        <input type="hidden" name="token" th:value="${token}">

        <p class="check-result fail" th:if="${resetError}" th:text="${resetError}"></p>

        <div class="field">
            <label for="newPassword">새 비밀번호</label>
            <input type="password" id="newPassword" name="newPassword" minlength="8" maxlength="20"
                   onblur="validateNewPassword()" oninput="onNewPasswordInput()">
            <span class="check-result" id="newPasswordResult"></span>
            <p class="hint">영문 대/소문자·숫자·특수문자(!@#$%^&*()) 모두 포함, 8~20자</p>
        </div>

        <div class="field">
            <label for="newPasswordCheck">새 비밀번호 확인</label>
            <input type="password" id="newPasswordCheck" name="newPasswordCheck" oninput="validateNewPasswordMatch()">
            <span class="check-result" id="newPasswordCheckResult"></span>
        </div>

        <div class="form-actions">
            <button class="submit" type="submit">비밀번호 재설정</button>
            <a class="btn-cancel" th:href="@{/login}">취소</a>
        </div>
    </form>

</div>

</body>
</html>
