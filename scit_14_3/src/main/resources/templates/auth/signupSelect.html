<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>회원가입 · 사찰 커뮤니티</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/auth/signupSelect.css}">
    <!-- signupSelect.js는 내용이 전부 주석 처리돼있어서(아래 참고) 불러와도 아무 동작 안 함 -->
    <script src="/js/auth/signupSelect.js" defer></script>
</head>
<body>
<div th:replace="~{fragments/common-includes :: commonIncludes}"></div>
<div class="card">
    <div class="header">
       <h1>회원가입</h1>
       <p>원하시는 방법으로 가입을 진행해주세요</p>
    </div>

    <div class="method-list">
       <a class="method-btn email" th:href="@{/signup?mode=local}">이메일로 가입하기</a>
       <!-- [변경] /signup?mode=kakao 로 바로 보내면 카카오 인증을 거치지 않은 채
            신원 확인 없이 가입 폼으로 가버림. 반드시 /login/kakao 로 보내서
            카카오 인가 -> 콜백을 거치게 해야 함. 이미 가입된 카카오 계정이면
            콜백에서 바로 로그인 처리되고, 처음이면 콜백이 알아서
            /signup?mode=kakao 로 넘겨줌(세션에 pendingKakaoId 채운 뒤). -->
       <a class="method-btn kakao" th:href="@{/login/kakao(intent='signup')}">카카오로 가입하기</a>
       
       <!--        <div class="divider">다른 방법 (준비 중)</div>-->
       
       <!--        <span class="method-btn naver disabled" aria-disabled="true">-->
       <!--      네이버로 가입하기 <span class="soon-tag">준비중</span>-->
       <!--    </span>-->
       <!--        <span class="method-btn google disabled" aria-disabled="true">-->
       <!--      구글로 가입하기 <span class="soon-tag">준비중</span>-->
       <!--    </span>-->
    </div>
    
    <p class="footer-note">이미 계정이 있으신가요? <a th:href="@{/login}">로그인</a></p>
</div>
</body>
</html>
