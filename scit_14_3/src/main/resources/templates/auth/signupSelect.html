<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>회원가입 · 사찰 커뮤니티</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/auth/signupSelect.css}">
    <script th:src="@{/js/auth/signupSelect.i18n.js}" defer></script>
</head>
<body>
<div th:replace="~{fragments/common-includes :: commonIncludes}"></div>
<div class="card">
    <div class="header">
       <h1 data-i18n="title">회원가입</h1>
       <p data-i18n="subtitle">원하시는 방법으로 가입을 진행해주세요</p>
    </div>

    <div class="method-list">
       <a class="method-btn email" th:href="@{/signup?mode=local}" data-i18n="emailBtn">이메일로 가입하기</a>
       <!-- [변경] /signup?mode=kakao 로 바로 보내면 카카오 인증을 거치지 않은 채
            신원 확인 없이 가입 폼으로 가버림. 반드시 /login/kakao 로 보내서
            카카오 인가 -> 콜백을 거치게 해야 함. 이미 가입된 카카오 계정이면
            콜백에서 바로 로그인 처리되고, 처음이면 콜백이 알아서
            /signup?mode=kakao 로 넘겨줌(세션에 pendingKakaoId 채운 뒤). -->
       <a class="method-btn kakao" th:href="@{/login/kakao(intent='signup')}" data-i18n="kakaoBtn">카카오로 가입하기</a>
    </div>

    <p class="footer-note"><span data-i18n="footerNoteText">이미 계정이 있으신가요?</span> <a th:href="@{/login}" data-i18n="footerNoteLoginLink">로그인</a></p>
</div>
</body>
</html>
