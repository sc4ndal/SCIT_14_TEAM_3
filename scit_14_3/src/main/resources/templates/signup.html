<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta content="width=device-width, initial-scale=1.0" name="viewport">
	<title>회원가입 · 사찰 커뮤니티</title>
	<link href="https://fonts.googleapis.com" rel="preconnect">
	<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap"
	      rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/signup.css}">
	<script defer src="/js/common.js"></script>
	<script defer src="/js/signup.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<div class="card">
	<div th:replace="~{fragments/language-fragment :: languageBar}"></div>
	
	<div class="beam">
		<span></span><span></span><span></span><span></span><span></span>
		<span></span><span></span><span></span><span></span><span></span>
		<span></span><span></span><span></span><span></span><span></span>
	</div>
	
	<div class="header">
		<h1 data-i18n th:if="${mode == 'local' or mode == null}">일반 회원가입</h1>
		<h1 data-i18n th:if="${mode == 'kakao'}">카카오로 회원가입</h1>
		<p data-i18n>사찰 커뮤니티 이용을 위한 정보를 입력해주세요</p>
		<p class="req-note"><span class="req">*</span> <span data-i18n>표시는 필수 입력 항목입니다</span></p>
	</div>
	
	<form onsubmit="return false;">
		
		<!-- ===== 인증 방식 섹션 ===== -->
		<fieldset id="localSection" th:if="${mode == 'local' or mode == null}">
			<legend data-i18n>로그인 정보</legend>
			
			<div class="field">
				<label for="loginId"><span data-i18n>아이디</span><span class="req">*</span></label>
				<div class="field-inline">
					<input data-i18n-placeholder id="loginId" maxlength="20" minlength="6" name="login_id" onblur="validateLoginId()"
					       oninput="clearResultIfEmpty('loginId','loginIdResult')" placeholder="영문/숫자 6~20자"
					       type="text">
					<button class="btn-check" data-i18n onclick="checkLoginId()" type="button">중복확인</button>
				</div>
				<span class="check-result" id="loginIdResult"></span>
			</div>
			
			<div class="field">
				<label for="pw"><span data-i18n>비밀번호</span><span class="req">*</span></label>
				<input id="pw" maxlength="20" minlength="8" name="password" onblur="validatePassword()" oninput="onPasswordInput()"
				       type="password">
				<span class="check-result" id="pwResult"></span>
				<p class="hint" data-i18n>영문 대/소문자·숫자·특수문자(!@#$%^&*()) 모두 포함, 8~20자</p>
			</div>
			<div class="field">
				<label for="pwCheck"><span data-i18n>비밀번호 확인</span><span class="req">*</span></label>
				<input id="pwCheck" oninput="validatePasswordMatch()" type="password">
				<span class="check-result" id="pwCheckResult"></span>
			</div>
		</fieldset>
		
		<fieldset id="kakaoSection" th:if="${mode == 'kakao'}">
			<legend data-i18n>로그인 정보</legend>
			<div class="kakao-box">
				<span data-i18n>카카오 인증 완료</span>
				<span class="badge" data-i18n>연결됨</span>
			</div>
		</fieldset>
		
		<!-- ===== 공통 회원정보 섹션 ===== -->
		<fieldset>
			<legend data-i18n>회원 정보</legend>
			
			<div class="field">
				<label for="nickname"><span data-i18n>법명 (닉네임)</span><span class="req">*</span></label>
				<div class="field-inline">
					<input id="nickname" maxlength="10" name="nickname" onblur="validateNickname()" oninput="clearResultIfEmpty('nickname','nicknameResult')"
					       type="text">
					<button class="btn-check" data-i18n onclick="checkNickname()" type="button">중복확인</button>
				</div>
				<span class="check-result" id="nicknameResult"></span>
				<p class="hint locked" data-i18n>가입 후 수정할 수 없습니다</p>
			</div>
			
			<div class="field">
				<label><span data-i18n>국적 구분</span></label>
				<div class="radio-group">
					<label><input checked name="nationality" onchange="onNationalityChange()" type="radio" value="KR">
						<span data-i18n>내국인</span></label>
					<label><input name="nationality" onchange="onNationalityChange()" type="radio" value="FOREIGN">
						<span data-i18n>외국인</span></label>
				</div>
			</div>
			
			<div class="field">
				<label for="name"><span data-i18n>이름</span><span class="req">*</span></label>
				<input id="name" maxlength="5" name="name" onblur="validateName()" oninput="clearResultIfEmpty('name','nameResult')" pattern="^[가-힣]{2,5}$"
				       placeholder="예: 싯다르타" type="text">
				<span class="check-result" id="nameResult"></span>
				<p class="hint" id="nameHint">한글로만 입력 가능합니다 (공백 없이)</p>
			</div>
			
			<div class="field">
				<label for="birth"><span data-i18n>생년월일</span><span class="req">*</span></label>
				<input id="birth" name="birth_date" onblur="validateBirthDate()" onchange="validateBirthDate()"
				       type="date">
				<span class="check-result" id="birthResult"></span>
			</div>
			
			<div class="field">
				<label for="emailLocal"><span data-i18n>이메일</span><span class="req">*</span></label>
				<div class="email-row">
					<input class="email-local" data-i18n-placeholder id="emailLocal" oninput="updateFullEmail(); resetEmailFlow();" placeholder="이메일 아이디"
					       type="text">
					<span class="at-sign">@</span>
					<select id="emailDomainSelect" onchange="handleDomainChange()">
						<option value="naver.com">naver.com</option>
						<option value="gmail.com">gmail.com</option>
						<option value="daum.net">daum.net</option>
						<option value="kakao.com">kakao.com</option>
						<option value="nate.com">nate.com</option>
						<option value="hanmail.net">hanmail.net</option>
						<option value="outlook.com">outlook.com</option>
						<option value="icloud.com">icloud.com</option>
						<option data-i18n value="custom">직접입력</option>
					</select>
					<input class="domain-custom" data-i18n-placeholder id="emailDomainCustom" oninput="updateFullEmail(); resetEmailFlow();"
					       placeholder="도메인 입력" style="display:none" type="text">
					<button class="btn-check" data-i18n onclick="checkEmailDuplicate()" type="button">중복조회</button>
				</div>
				<span class="check-result" id="emailResult"></span>
				
				<button class="btn-check btn-send-mail" id="sendMailBtn" onclick="sendVerificationMail()" type="button">
					메일발송
				</button>
				
				<div class="verify-box" id="verifySection">
					<div class="field-inline">
						<input data-i18n-placeholder id="verifyCode" maxlength="6" placeholder="이메일로 받은 인증번호 6자리"
						       type="text">
						<button class="btn-check" data-i18n onclick="confirmCode()" type="button">확인</button>
					</div>
					<div class="verify-meta">
						<span class="timer" id="timerDisplay">05:00</span>
					</div>
					<span class="check-result" id="verifyResult"></span>
				</div>
				
				<input id="email" name="email" type="hidden" value="">
			</div>
			
			<div class="field">
				<label for="phone"><span data-i18n>연락처</span> <span class="optional-note" data-i18n>(선택)</span></label>
				<input data-i18n-placeholder id="phone" name="phone" placeholder="전화번호" type="tel">
			</div>
		</fieldset>
		
		<!-- 화면에 노출되지 않는 값들
			 주의: mode에 따른 login_type/kakao_id는 더 이상 JS(setMode)가 채우지 않습니다.
			 서버가 th:value로 직접 확정해야 합니다 (응답 요약 참고). -->
		<input id="loginType" name="login_type" th:value="${mode == 'kakao' ? 'KAKAO' : 'LOCAL'}" type="hidden"
		       value="LOCAL">
		<input id="kakaoId" name="kakao_id" type="hidden" value="">
		<input id="emailVerified" name="email_verified" type="hidden" value="false">
		<input id="preferredLanguageField" name="preferred_language" type="hidden" value="ko">
		<input name="role" type="hidden" value="USER">
		
		<label class="terms-checkbox">
			<input id="agreeTerms" type="checkbox">
			<span><span class="req-tag" data-i18n>[필수]</span><span data-i18n>서비스 이용약관 및 개인정보 처리방침에 동의합니다</span></span>
		</label>
		
		<label class="terms-checkbox">
			<input id="agreeMarketing" onchange="onMarketingConsentChange(this.checked)" type="checkbox">
			<span><span class="opt-tag" data-i18n>[선택]</span><span data-i18n>이벤트·할인 등 광고성 정보를 이메일로 수신하는 것에 동의합니다</span></span>
		</label>
		
		<input id="marketingConsentField" name="marketing_email_consent" type="hidden" value="false">
		<input id="marketingConsentAtField" name="marketing_email_consent_at" type="hidden" value="">
		
		<div class="form-actions">
			<button class="submit" data-i18n type="submit">가입 완료</button>
			<a class="btn-cancel" data-i18n th:href="@{/}">취소</a>
		</div>
	</form>
</div>
</body>
</html>
