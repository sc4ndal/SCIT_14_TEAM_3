<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>회원가입 · 사찰 커뮤니티</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/signup.css}">
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<script src="/js/common.js" defer></script>
	<script src="/js/signup.js" defer></script>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<div class="card">
	<div th:replace="~{fragments/common-includes :: commonIncludes}"></div>

	<div class="header">
		<h1 th:if="${mode == 'local' or mode == null}" data-i18n="titleLocal">일반 회원가입</h1>
		<h1 th:if="${mode == 'kakao'}" data-i18n="titleKakao">카카오로 회원가입</h1>
		<p data-i18n="subtitle">사찰 커뮤니티 이용을 위한 정보를 입력해주세요</p>
		<p class="req-note"><span class="req">*</span> <span data-i18n="requiredNote">표시는 필수 입력 항목입니다</span></p>
	</div>

	<!-- ===== [추가] 회원가입 실패 시 에러 메시지 (UserController의 flash attribute) ===== -->
	<p class="check-result" style="color:#c0392b; text-align:center;" th:if="${signupError}" th:text="${signupError}"></p>
	
	<form th:action="${mode == 'kakao'} ? @{/signup/kakao-additional} : @{/signup/local}" method="post">

		<!-- ===== 인증 방식 섹션 ===== -->
		<fieldset th:if="${mode == 'local' or mode == null}" id="localSection">
			<legend data-i18n="sectionLogin">로그인 정보</legend>

			<div class="field">
				<label for="loginId"><span data-i18n="loginIdLabel">아이디</span><span class="req">*</span></label>
				<div class="field-inline">
					<input type="text" id="loginId" name="loginId" minlength="6" maxlength="20" data-i18n-placeholder="loginIdPlaceholder" placeholder="영문/숫자 6~20자" onblur="validateLoginId()" oninput="clearResult('loginIdResult')">
					<button type="button" class="btn-check" data-i18n="btnCheck" onclick="checkLoginId()">중복확인</button>
				</div>
				<span class="check-result" id="loginIdResult"></span>
			</div>

			<div class="field">
				<label for="pw"><span data-i18n="pwLabel">비밀번호</span><span class="req">*</span></label>
				<input type="password" id="pw" name="password" minlength="8" maxlength="20" onblur="validatePassword()" oninput="onPasswordInput()">
				<span class="check-result" id="pwResult"></span>
				<p class="hint" data-i18n="passwordHint">영문 대/소문자·숫자·특수문자(!@#$%^&*()) 모두 포함, 8~20자</p>
			</div>
			<div class="field">
				<label for="pwCheck"><span data-i18n="pwCheckLabel">비밀번호 확인</span><span class="req">*</span></label>
				<input type="password" id="pwCheck" oninput="validatePasswordMatch()">
				<span class="check-result" id="pwCheckResult"></span>
			</div>
		</fieldset>

		<fieldset th:if="${mode == 'kakao'}" id="kakaoSection">
			<legend data-i18n="sectionLogin">로그인 정보</legend>
			<div class="kakao-box">
				<span data-i18n="kakaoDone">카카오 인증 완료</span>
				<span class="badge" data-i18n="kakaoConnected">연결됨</span>
			</div>
		</fieldset>

		<!-- ===== 공통 회원정보 섹션 ===== -->
		<fieldset>
			<legend data-i18n="sectionMember">회원 정보</legend>

			<div class="field">
				<label for="nickname"><span data-i18n="nicknameLabel">법명 (닉네임)</span><span class="req">*</span></label>
				<div class="field-inline">
					<input type="text" id="nickname" name="nickname" maxlength="10" onblur="validateNickname()" oninput="clearResult('nicknameResult')">
					<button type="button" class="btn-check" data-i18n="btnCheck" onclick="checkNickname()">중복확인</button>
				</div>
				<span class="check-result" id="nicknameResult"></span>
				<p class="hint locked" data-i18n="lockedHint">가입 후 수정할 수 없습니다</p>
			</div>
			
			<!-- 국적 구분은 DB에 저장되지 않음 - name 필드를 한글/여권영문 중
			     어떤 형식으로 검증할지 전환하는 용도로만 사용 (onNationalityChange()) -->

			<div class="field">
				<label><span data-i18n="nationalityLabel">국적 구분</span></label>
				<div class="radio-group">
					<label><input type="radio" name="nationality" value="KR" checked onchange="onNationalityChange()"> <span data-i18n="natKR">내국인</span></label>
					<label><input type="radio" name="nationality" value="FOREIGN" onchange="onNationalityChange()"> <span data-i18n="natForeign">외국인</span></label>
				</div>
			</div>

			<div class="field">
				<label for="name"><span data-i18n="nameLabel">이름</span><span class="req">*</span></label>
				<input type="text" id="name" name="name" maxlength="5" pattern="^[가-힣]{2,5}$" placeholder="예: 싯다르타" onblur="validateName()" oninput="clearResultIfEmpty('name','nameResult')">
				<span class="check-result" id="nameResult"></span>
				<p class="hint" id="nameHint">한글로만 입력 가능합니다 (공백 없이)</p>
			</div>

			<div class="field">
				<label for="emailLocal"><span data-i18n>이메일</span><span class="req">*</span></label>
				<div class="email-row">
					<input type="text" id="emailLocal" class="email-local" data-i18n-placeholder="emailLocalPlaceholder" placeholder="이메일 아이디" oninput="updateFullEmail(); resetEmailFlow();">
					<span class="at-sign">@</span>
					<select id="emailDomainSelect" onchange="handleDomainChange()">
						<option value="naver.com">naver.com</option>
						<option value="gmail.com">gmail.com</option>
						<option value="daum.net">daum.net</option>
						<option value="kakao.com">kakao.com</option>
						<option value="nate.com">nate.com</option>
						<option value="hanmail.net">hanmail.net</option>
						<option value="outlook.com">outlook.com</option>
						<option value="icloud.com">icloud.com</option>
						<option value="custom" data-i18n="domainCustomOption">직접입력</option>
					</select>
					<input type="text" id="emailDomainCustom" class="domain-custom" style="display:none" data-i18n-placeholder="domainCustomPlaceholder" placeholder="도메인 입력" oninput="updateFullEmail(); resetEmailFlow();">
					<button type="button" class="btn-check" data-i18n="btnEmailCheck" onclick="checkEmailDuplicate()">중복조회</button>
				</div>
				<span class="check-result" id="emailResult"></span>

				<button type="button" class="btn-check btn-send-mail" id="sendMailBtn" onclick="sendVerificationMail()">메일발송</button>

				<div class="verify-box" id="verifySection">
					<div class="field-inline">
						<input type="text" id="verifyCode" maxlength="6" data-i18n-placeholder="verifyPlaceholder" placeholder="이메일로 받은 인증번호 6자리">
						<button type="button" class="btn-check" data-i18n="verifyBtnConfirm" onclick="confirmCode()">확인</button>
					</div>
					<div class="verify-meta">
						<span class="timer" id="timerDisplay">05:00</span>
					</div>
					<span class="check-result" id="verifyResult"></span>
				</div>

				<input type="hidden" id="email" name="email" value="">
			</div>

			<div class="field">
				<label for="phone"><span data-i18n="phoneLabel">연락처</span> <span class="optional-note" data-i18n="phoneOptional">(선택)</span></label>
				<input type="tel" id="phone" name="phone" data-i18n-placeholder="phonePlaceholder" placeholder="전화번호">
			</div>
		</fieldset>

		<!-- 화면에 노출되지 않는 값들
			 주의: mode에 따른 login_type/kakao_id는 더 이상 JS(setMode)가 채우지 않습니다.
			 서버가 th:value로 직접 확정해야 합니다 (응답 요약 참고). -->
		<input id="loginType" name="login_type" th:value="${mode == 'kakao' ? 'KAKAO' : 'LOCAL'}" type="hidden"
		       value="LOCAL">
		<!-- [변경] 화면 표시/디버그 참고용으로만 채움. 서버(UserController)는 이 값을 신뢰하지 않고
		     세션의 pendingKakaoId만 사용해서 실제 가입을 처리함 (hidden 필드 조작 방지) -->
		<input id="kakaoId" name="kakao_id" th:value="${mode == 'kakao'} ? ${kakaoId} : null" type="hidden" value="">
		<input id="emailVerified" name="email_verified" type="hidden" value="false">
		<input id="preferredLanguageField" name="preferred_language" type="hidden" value="ko">
		<input name="role" type="hidden" value="USER">
		
		<label class="terms-checkbox">
			<input type="checkbox" id="agreeTerms">
			<span><span class="req-tag" data-i18n="termsRequired">[필수]</span><span data-i18n="termsText">서비스 이용약관 및 개인정보 처리방침에 동의합니다</span></span>
		</label>

		<label class="terms-checkbox">
			<input type="checkbox" id="agreeMarketing" onchange="onMarketingConsentChange(this.checked)">
			<span><span class="opt-tag" data-i18n="marketingOptional">[선택]</span><span data-i18n="marketingText">이벤트·할인 등 광고성 정보를 이메일로 수신하는 것에 동의합니다</span></span>
		</label>

		<input type="hidden" id="marketingConsentField" name="marketing_email_consent" value="false">
		<input type="hidden" id="marketingConsentAtField" name="marketing_email_consent_at" value="">

		<div class="form-actions">
			<button class="submit" type="submit" data-i18n="submitBtn">가입 완료</button>
			<a th:href="@{/}" class="btn-cancel" data-i18n="cancelBtn">취소</a>
		</div>
	</form>
</div>

<!-- ===== [추가] 카카오 이메일 프리필 =====
     signup.js의 기존 함수(updateFullEmail/resetEmailFlow 등)는 그대로 두고,
     페이지 로드 시 한 번만 이메일 입력칸/도메인 select를 채워주는 역할만 합니다.
     카카오가 이미 검증한 이메일이라고 보고 인증 절차(메일발송/인증번호)는 건너뜁니다.
     주의: 사용자가 이 이메일을 직접 수정하면 기존 resetEmailFlow()가 인증상태를 다시
     초기화할 텐데, 그 경우 인증 UI를 다시 보여줄지는 signup.js 쪽에서 같이 봐야 합니다. -->
<script th:if="${mode == 'kakao'}" th:inline="javascript">
/*<![CDATA[*/
(function () {
    var kakaoEmail = /*[[${kakaoEmail}]]*/ null;
    if (!kakaoEmail) return;

    var atIndex = kakaoEmail.indexOf('@');
    if (atIndex === -1) return;
    var localPart = kakaoEmail.substring(0, atIndex);
    var domainPart = kakaoEmail.substring(atIndex + 1);

    document.getElementById('emailLocal').value = localPart;

    var domainSelect = document.getElementById('emailDomainSelect');
    var matched = false;
    for (var i = 0; i < domainSelect.options.length; i++) {
        if (domainSelect.options[i].value === domainPart) {
            domainSelect.value = domainPart;
            matched = true;
            break;
        }
    }
    if (!matched) {
        domainSelect.value = 'custom';
        var customInput = document.getElementById('emailDomainCustom');
        if (customInput) {
            customInput.style.display = '';
            customInput.value = domainPart;
        }
    }

    document.getElementById('email').value = kakaoEmail;
    document.getElementById('emailVerified').value = 'true';

    var verifySection = document.getElementById('verifySection');
    if (verifySection) verifySection.style.display = 'none';
    var sendMailBtn = document.getElementById('sendMailBtn');
    if (sendMailBtn) sendMailBtn.style.display = 'none';
})();
/*]]>*/
</script>

</body>
</html>
