<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사찰 예절 시뮬레이션</title>
    <!-- 사이트 공용 헤더(로고/로그인/회원가입)는 16:9 몰입형 프레임과 안 맞아서 안 씀.
         언어 전환만 필요해서 fragments/common-includes.html의 languageOnly 조각만 따로 가져다 씀
         (common.js가 실려서 대사/선택지/엔딩 텍스트도 다른 페이지처럼 AI 번역 대상이 됨). -->
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/etiquette/EtiquetteSimulation.css}">
    <script th:inline="javascript">
        /*<![CDATA[*/
        const BGM_ROOM_URL = /*[[@{/sounds/etiquette/bgmRoom.mp3}]]*/   '/sounds/etiquette/bgmRoom.mp3';
        const BGM_TEMPLE_URL = /*[[@{/sounds/etiquette/bgmTemple.mp3*/  '/sounds/etiquette/bgmTemple.mp3';
        const BGM_HIDDEN_URL = /*[[@{/sounds/etiquette/bgmHidden.mp3*/  '/sounds/etiquette/bgmHidden.mp3';
        /*]]>*/
    </script>
</head>
<body>

<div id="game-root">

    <div class="etiquette-language-widget" th:insert="~{fragments/common-includes :: languageOnly}"></div>

    <!-- 로딩 (씬 배경 이미지 전부 미리 받아올 때까지 표시, EtiquetteSimulation.js 상단 preloadSceneImages 참고) -->
    <div class="screen active" id="screen-loading">
        <p data-i18n="ui.loadingText">불러오는 중...</p>
        <div id="loading-bar-track"><div id="loading-bar-fill"></div></div>
        <div id="loading-percent">0%</div>
    </div>

    <!-- 타이틀 -->
    <div class="screen" id="screen-title">
        <div id="title-main">
            <h1 data-i18n="ui.titleH1">사찰 예절 시뮬레이션</h1>
            <p><span data-i18n="ui.titleSub2">선택을 통해 첫 사찰 방문을 경험해보세요.</span></p>
            <button class="btn btn-primary" id="btn-start" data-i18n="ui.btnStart">시작하기</button>
            <button class="btn" id="btn-open-collection" data-i18n="ui.btnCollection">엔딩 도감</button>
        </div>
        <a class="link-home" th:href="@{/}" data-i18n="ui.linkHome">메인으로 돌아가기</a>
    </div>

    <!-- 진행 화면 (스토리 / 선택지 공용) -->
    <div class="screen" id="screen-scene">
        <div id="bg-layer">
            <span id="bg-label">BG</span>
        </div>

        <div class="scene-toolbar">
            <button class="toolbar-btn" id="btn-bgm-toggle" type="button" title="배경음악 끄기/켜기">
                <svg id="bgm-icon-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="3 9 3 15 8 15 13 20 13 4 8 9 3 9"></polygon>
                    <path d="M16 8a5 5 0 0 1 0 8"></path>
                    <path d="M18.5 5.5a9 9 0 0 1 0 13"></path>
                </svg>
                <svg id="bgm-icon-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                    <polygon points="3 9 3 15 8 15 13 20 13 4 8 9 3 9"></polygon>
                    <line x1="16" y1="9" x2="22" y2="15"></line>
                    <line x1="22" y1="9" x2="16" y2="15"></line>
                </svg>
            </button>
            <button class="toolbar-btn" id="btn-history-back" type="button" title="이전 대화">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <button class="toolbar-btn" id="btn-toggle-dialogue" type="button" title="대화창 끄기">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
            </button>
            <button class="toolbar-btn" id="btn-restart-title" type="button" title="시뮬레이션 처음으로 돌아가기">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 12a9 9 0 1 0 3-6.7" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M3 4v5h5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <a class="toolbar-btn" th:href="@{/}" title="메인으로 돌아가기">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"></path><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"></path></svg>
            </a>
        </div>

        <div id="dialogue-dock">
            <div id="text-box">
                <div id="speaker"></div>
                <div id="story-text"></div>
                <div id="advance-hint">▶ 클릭해서 계속</div>
            </div>
            <div id="choice-layer"></div>
        </div>
    </div>

    <!-- 엔딩 -->
    <div class="screen" id="screen-ending">
        <div id="ending-name"></div>
        <div id="ending-title"></div>
        <div id="ending-score"></div>
        <div id="ending-desc"></div>
        <button class="btn btn-primary" id="btn-goto-result" data-i18n="ui.btnGotoResult">오늘의 참배 돌아보기</button>
        <div class="bgm-credit">배경음악: 국악 배경음악 #126 (저작자: 공유마당, CC BY)</div>
    </div>

    <!-- 결과: 오늘의 참배 돌아보기 -->
    <div class="screen" id="screen-result">
        <div id="result-inner">
            <div id="result-summary"></div>
            <div class="result-section-title" data-i18n="ui.checklistTitle">✓ 잘 지킨 예절</div>
            <div id="checklist"></div>
            <div id="review-list"></div>
            <div id="result-actions">
                <button class="btn" id="btn-result-replay" data-i18n="ui.btnReplay">다시 플레이하기</button>
                <button class="btn" id="btn-result-title" data-i18n="ui.btnBackTitle">처음 화면으로</button>
            </div>
        </div>
    </div>

    <!-- 엔딩 도감 -->
    <div class="screen" id="screen-collection">
        <div id="collection-inner">
            <button class="btn" id="btn-close-collection" style="margin-bottom:14px;" data-i18n="ui.btnBack">← 뒤로</button>
            <h1 style="font-size:18px;margin:0 0 4px;" data-i18n="ui.collectionH1">엔딩 도감</h1>
            <p style="font-size:13px;opacity:.6;margin:0;" data-i18n="ui.collectionDesc">아직 발견하지 못한 엔딩은 ???로 표시됩니다.</p>
            <div id="collection-grid"></div>
        </div>
    </div>

</div>

<script th:src="@{/js/etiquette/EtiquetteSimulation.js}"></script>
<script th:src="@{/js/etiquette/EtiquetteSimulation.i18n.js}"></script>
</body>
</html>
