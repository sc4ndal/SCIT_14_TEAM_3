<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
	컨테이너(서블릿) 레벨 오류용 기본 화면.

	GlobalExceptionHandler(@ControllerAdvice)는 DispatcherServlet 안까지 들어온 예외만 잡는다.
	Security 필터에서 바로 튕기는 403이나 매핑을 아예 못 찾은 요청은 거기까지 오지 않고
	서블릿 컨테이너가 /error로 넘기는데, 그때 templates/error.html이 없으면
	Whitelabel Error Page(개발 모드에선 스택트레이스까지)가 그대로 노출된다.

	화면 구성은 errorView/error.html과 맞췄다.
	BasicErrorController가 넣어주는 message는 예외 메시지가 그대로 담길 수 있어 쓰지 않고,
	상태 코드로 문구를 고른다.
-->
<head>
    <meta charset="UTF-8">
    <title>오류 발생</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .error-box { max-width: 640px; margin: 0 auto; padding: 40px 30px; border: 1px solid #ddd; border-radius: 10px; text-align: center; }
        h1 { margin-top: 0; }
        .desc { color: #555; margin: 16px 0 28px; line-height: 1.6; }
        .meta { font-size: 13px; color: #888; margin-top: 24px; }
        .meta code { background: #f5f5f5; padding: 2px 6px; border-radius: 4px; }
        .actions { margin-top: 28px; }
        .actions a { display: inline-block; padding: 10px 20px; border: 1px solid #ccc; border-radius: 6px; text-decoration: none; color: #333; margin: 0 4px; }
    </style>
</head>
<body>

<div class="error-box">
    <h1>🚨 요청을 처리하지 못했습니다</h1>

    <p class="desc" th:switch="${status}">
        <span th:case="401">로그인이 필요하거나 인증에 실패했습니다.</span>
        <span th:case="403">해당 요청에 대한 권한이 없습니다.</span>
        <span th:case="404">요청하신 페이지를 찾을 수 없습니다.</span>
        <span th:case="*">일시적인 오류가 발생했습니다. 잠시 후 다시 시도해주세요.</span>
    </p>

    <div class="actions">
        <a th:href="@{/}">홈으로</a>
        <a href="javascript:history.back()">이전 페이지</a>
    </div>

    <div class="meta">
        <span th:if="${status}">오류 코드 <code th:text="${status}">500</code></span>
        <div th:if="${timestamp}" th:text="${#dates.format(timestamp, 'yyyy-MM-dd HH:mm:ss')}">2026-09-01 12:00:00</div>
    </div>
</div>

</body>
</html>
