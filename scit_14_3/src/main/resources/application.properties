spring.application.name=scit_14_3

spring.devtools.livereload.enabled=true
spring.thymeleaf.cache=false

## 경로 ######################################################
server.port=9797
server.servlet.context-path=/


## 로그 ######################################################
logging.level.root=info
logging.level.net.datasa.scit_14_3=debug
# Hibernate가 시작할 때 DB 연결정보(URL/드라이버/dialect 등)를 찍는 정보성 로그 끄기
logging.level.org.hibernate.orm.connections.pooling=warn


## MySQL ####################################################
# 데이터베이스 연결 주소 (본인 환경에 맞게 수정하세요)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/scit_14_3?useSSL=false&serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root


## JPA ######################################################
spring.jpa.show-sql=true
# 테이블은 docs/exam.sql로 직접 생성 -> validate로 엔티티와 스키마 일치만 검증
spring.jpa.hibernate.ddl-auto=validate
# 최신 Hibernate는 JDBC 연결 정보로 dialect를 자동 감지하므로 별도 지정 불필요
spring.jpa.properties.hibernate.format_sql=true

## KAKAO REST API #########################################
kakao.client-id=dd24534d3bc00b93d5ed8dd8224c25bc
kakao.redirect-uri=http://localhost:9797/login/kakao/callback