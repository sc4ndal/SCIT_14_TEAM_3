spring.application.name=scit_14_3

# application-local.properties(git 추적 제외)가 있으면 여기 값을 덮어씀 - 메일 계정처럼
# 커밋하면 안 되는 값은 그 파일에 둔다. 파일 없어도 에러 안 남(optional).
spring.config.import=optional:application-local.properties

spring.devtools.livereload.enabled=true
spring.thymeleaf.cache=false

## 경로 ######################################################
server.port=9797
server.servlet.context-path=/


## 로그 ######################################################
logging.level.root=info
logging.level.net.datasa.scit_14_3=debug
# Hibernate가 시작할 때 DB 연결정보(URL/드라이버/dialect 등)를 찍는 정보성 로그 끄기
logging.level.org.hibernate.orm.connections.pooling=warn


## MySQL ####################################################
# 데이터베이스 연결 주소 (본인 환경에 맞게 수정하세요)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/scit_14_3?useSSL=false&serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root


## JPA ######################################################
spring.jpa.show-sql=true
# 테이블은 docs/exam.sql로 직접 생성 -> validate로 엔티티와 스키마 일치만 검증
spring.jpa.hibernate.ddl-auto=validate
# 최신 Hibernate는 JDBC 연결 정보로 dialect를 자동 감지하므로 별도 지정 불필요
spring.jpa.properties.hibernate.format_sql=true

## KAKAO REST API #########################################
# client-id는 application-local.properties에 둔다(git 추적 제외, 공개 레포라 노출 안 시킴)
kakao.redirect-uri=http://localhost:9797/login/kakao/callback

## MAIL (이메일 인증코드 발송) ###############################
# 계정(username/password)은 여기 안 두고 application-local.properties에 둔다(git 추적 제외).
# 처음 받은 사람은 application-local.properties 참고해서 그 이름으로 파일 만들면 됨.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true